<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartografía Cimática — Datos en Arena y Volumen en dB</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Exclusivamente Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Montserrat', 'sans-serif'],
                    },
                    colors: {
                        signal: '#111111',
                        signalSoft: '#333333',
                        plate: '#FAF9F5',
                        sandLight: '#111111',
                        pictoTransito: '#D97706',
                        pictoObras: '#EA580C',
                        pictoPersonas: '#0284C7',
                        pictoNaturaleza: '#16A34A'
                    }
                }
            }
        }
    </script>

    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            font-family: 'Montserrat', sans-serif;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #FAF9F5;
            color: #111111;
            -webkit-font-smoothing: antialiased;
        }

        /* Lienzo de simulación de arena pigmentada */
        #sandCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Textura sutil de placa blanca mate editorial */
        .plate-vignette {
            position: absolute;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            background: radial-gradient(
                circle at 50% 50%,
                rgba(255, 255, 255, 0) 0%,
                rgba(235, 232, 224, 0.28) 78%,
                rgba(218, 214, 204, 0.55) 100%
            );
        }

        /* Halo editorial limpio para máxima legibilidad de la tipografía negra sobre la arena */
        .poster-text {
            text-shadow:
                0 2px 14px rgba(250, 249, 245, 0.98),
                0 0px 5px rgba(250, 249, 245, 0.98);
        }

        .ui-corner {
            position: fixed;
            z-index: 20;
            pointer-events: none;
        }
        .interactive {
            pointer-events: auto;
        }

        /* Botones de pictograma minimalistas en modo claro */
        .picto-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.42rem 0.85rem;
            border-radius: 9999px;
            border: 1px solid rgba(17, 17, 17, 0.18);
            background: rgba(250, 249, 245, 0.86);
            backdrop-filter: blur(8px);
            color: #111111;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.06em;
            transition: all 0.22s ease;
            box-shadow: 0 2px 10px rgba(17, 17, 17, 0.05);
        }
        .picto-btn:hover {
            transform: translateY(-1px);
            border-color: rgba(17, 17, 17, 0.65);
            background: #FFFFFF;
        }
        .picto-btn.active {
            background: #111111;
            border-color: #111111 !important;
            color: #FAF9F5;
            font-weight: 600;
            box-shadow: 0 4px 14px rgba(17, 17, 17, 0.18);
        }

        /* Chips de los 3 círculos de intensidad medida con micrófono (Bajo, Medio, Alto dB) */
        .ring-pill {
            padding: 0.34rem 0.78rem;
            border-radius: 9999px;
            border: 1px solid rgba(17, 17, 17, 0.20);
            background: rgba(250, 249, 245, 0.85);
            backdrop-filter: blur(6px);
            color: rgba(17, 17, 17, 0.80);
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.08em;
            transition: all 0.2s ease;
        }
        .ring-pill:hover {
            border-color: #111111;
            color: #111111;
            background: #FFFFFF;
        }
        .ring-pill.active {
            border-color: #111111;
            background: #111111;
            color: #FAF9F5;
            font-weight: 600;
        }

        /* Indicador de micro-vibración acústica */
        @keyframes acousticDot {
            0%, 100% { transform: scale(1); opacity: 0.95; }
            50% { transform: scale(1.38); opacity: 0.42; }
        }
        .vib-dot {
            animation: acousticDot 1.05s infinite ease-in-out;
        }

        /* Pulso sutil del llamado a la acción en la portada */
        @keyframes subtlePulse {
            0%, 100% { opacity: 0.95; transform: translateX(0); }
            50% { opacity: 0.55; transform: translateX(3px); }
        }
        .cta-pulse {
            animation: subtlePulse 2.8s infinite ease-in-out;
        }
    </style>
</head>
<body class="w-screen h-screen overflow-hidden select-none">

    <!-- LIENZO DE ARENA DE CUARZO Y PIGMENTOS -->
    <canvas id="sandCanvas"></canvas>
    <div class="plate-vignette"></div>

    <!-- ==========================================================================
         ESQUINA SUPERIOR IZQUIERDA (top: 44px, left: 52px)
         Emblema geométrico multicapa coloreado + Controles de Vibración y Pigmento
         ========================================================================== -->
    <div class="ui-corner top-7 left-7 sm:top-11 sm:left-13 flex items-center gap-5">
        <button onclick="handleTopEmblemClick()" class="interactive group text-left focus:outline-none" title="Cambiar etapa / Volver">
            <svg id="harmonicEmblem" width="84" height="84" viewBox="-52 -52 104 104" class="overflow-visible transition-transform duration-500 group-hover:scale-105">
                <!-- Polígonos coloreados según cada pictograma generados dinámicamente -->
            </svg>
        </button>

        <div class="flex flex-col items-start gap-2 poster-text">
            <div class="flex flex-wrap items-center gap-2">
                <!-- Control de vibración acústica en el lugar (responde a los dB del micrófono) -->
                <button onclick="toggleVibrationMode()" id="vibBadgeBtn" class="interactive inline-flex items-center gap-2 px-3 py-1 rounded-full border border-[#111111]/25 bg-[#FAF9F5]/85 backdrop-blur-md text-[#111111] text-[10px] font-medium tracking-[0.12em] uppercase hover:border-[#111111] hover:bg-white transition-all shadow-sm">
                    <span id="vibIndicatorDot" class="w-1.5 h-1.5 rounded-full bg-[#111111] vib-dot"></span>
                    <span id="vibStatusLabel">Vibración dB · Activa</span>
                </button>

                <!-- Conmutador de color de la arena: Pigmento Pictograma vs Basalto Oscuro -->
                <button onclick="toggleSandColorMode()" id="sandColorModeBtn" class="interactive inline-flex items-center gap-2 px-3 py-1 rounded-full border border-[#111111]/25 bg-[#FAF9F5]/85 backdrop-blur-md text-[#111111] text-[10px] font-medium tracking-[0.11em] uppercase hover:border-[#111111] hover:bg-white transition-all shadow-sm">
                    <span class="flex items-center -space-x-1">
                        <span class="w-2 h-2 rounded-full bg-[#D97706]"></span>
                        <span class="w-2 h-2 rounded-full bg-[#EA580C]"></span>
                        <span class="w-2 h-2 rounded-full bg-[#0284C7]"></span>
                        <span class="w-2 h-2 rounded-full bg-[#16A34A]"></span>
                    </span>
                    <span id="sandColorModeLabel">Arena: Pigmento Pictograma</span>
                </button>
            </div>

            <!-- Botón minimalista de retorno cuando se está en Etapa 1 o Etapa 2 -->
            <div id="topNavActions" class="interactive hidden items-center gap-2.5">
                <button id="backBtn" onclick="stepBack()" class="px-3.5 py-1.5 rounded-full border border-[#111111]/35 bg-[#FAF9F5]/90 text-[#111111] text-[10px] font-semibold tracking-[0.16em] uppercase hover:border-[#111111] hover:bg-[#111111] hover:text-[#FAF9F5] transition-all shadow-sm">
                    ← Volver
                </button>
            </div>
        </div>
    </div>

    <!-- ==========================================================================
         ESQUINA SUPERIOR DERECHA (top: 44px, right: 52px)
         Visible en Etapa 2 (Desglose de Lugar) para filtrar por los 4 Pictogramas
         con su color de arena y por los 3 Niveles de Volumen de Micrófono (dB)
         ========================================================================== -->
    <div id="detailFiltersCorner" class="ui-corner top-7 right-7 sm:top-11 sm:right-13 hidden flex-col items-end gap-3 max-w-2xl">
        <!-- Fila 1: Los 4 Pictogramas con su color de arena + Total -->
        <div class="interactive flex flex-wrap justify-end gap-2">
            <button onclick="setWaveFilter('todas')" id="wf-todas" class="picto-btn active">
                <span class="w-2.5 h-2.5 rounded-full bg-gradient-to-tr from-[#D97706] via-[#0284C7] to-[#16A34A]"></span>
                <span>Total</span>
                <span class="opacity-75" id="wfCount-todas">24</span>
            </button>

            <!-- 1. Tránsito (Ámbar Ocre #D97706) -->
            <button onclick="setWaveFilter('transito')" id="wf-transito" class="picto-btn" style="border-color: rgba(217,119,6,0.42);">
                <span class="w-2.5 h-2.5 rounded-full bg-[#D97706]"></span>
                <svg class="w-3.5 h-3.5 shrink-0 text-[#D97706]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 15h14l-1.5-5.5A2 2 0 0 0 15.6 8H8.4a2 2 0 0 0-1.9 1.5L5 15z"/>
                    <path d="M3 15h18v3a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1v-1H6v1a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-3z"/>
                    <circle cx="7.5" cy="12.5" r="0.8" fill="currentColor"/>
                    <circle cx="16.5" cy="12.5" r="0.8" fill="currentColor"/>
                </svg>
                <span>Tránsito</span>
                <span class="opacity-75 font-semibold" id="wfCount-transito">7</span>
            </button>

            <!-- 2. Obras (Terracota Bermellón #EA580C) -->
            <button onclick="setWaveFilter('obras')" id="wf-obras" class="picto-btn" style="border-color: rgba(234,88,12,0.42);">
                <span class="w-2.5 h-2.5 rounded-full bg-[#EA580C]"></span>
                <svg class="w-3.5 h-3.5 shrink-0 text-[#EA580C]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 4l6 6-2.5 2.5-6-6L14 4z"/>
                    <path d="M4 20l8.5-8.5"/>
                    <path d="M3 14h4M10 3v4M18 16l3 3"/>
                </svg>
                <span>Obras</span>
                <span class="opacity-75 font-semibold" id="wfCount-obras">3</span>
            </button>

            <!-- 3. Personas (Azul Cobalto #0284C7) -->
            <button onclick="setWaveFilter('personas')" id="wf-personas" class="picto-btn" style="border-color: rgba(2,132,199,0.42);">
                <span class="w-2.5 h-2.5 rounded-full bg-[#0284C7]"></span>
                <svg class="w-3.5 h-3.5 shrink-0 text-[#0284C7]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="9" cy="7.5" r="3"/>
                    <path d="M3.5 19c0-3 2.5-5.2 5.5-5.2s5.5 2.2 5.5 5.2"/>
                    <circle cx="16.5" cy="8.5" r="2.2"/>
                    <path d="M15 14.2c2.4.3 4.5 2 4.5 4.6"/>
                </svg>
                <span>Personas</span>
                <span class="opacity-75 font-semibold" id="wfCount-personas">4</span>
            </button>

            <!-- 4. Naturaleza (Verde Esmeralda #16A34A) -->
            <button onclick="setWaveFilter('naturaleza')" id="wf-naturaleza" class="picto-btn" style="border-color: rgba(22,163,74,0.42);">
                <span class="w-2.5 h-2.5 rounded-full bg-[#16A34A]"></span>
                <svg class="w-3.5 h-3.5 shrink-0 text-[#16A34A]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2 15c2.5-2.8 5.5-2.8 8 0s5.5 2.8 8 0 3.5-2 4-1"/>
                    <path d="M12 3c-3.5 2.2-5 6-2 8.8 3-2.8 1.5-6.6-2-8.8z"/>
                </svg>
                <span>Naturaleza</span>
                <span class="opacity-75 font-semibold" id="wfCount-naturaleza">10</span>
            </button>
        </div>

        <!-- Fila 2: Los 3 Niveles de Intensidad de Volumen captados con Micrófono (Bajo, Medio, Alto dB) -->
        <div class="interactive flex flex-wrap justify-end items-center gap-1.5">
            <span class="text-[9.5px] font-semibold tracking-[0.15em] uppercase text-[#111111]/70 mr-1 poster-text">Micrófono (dB):</span>
            <button onclick="setRingFilter(0)" id="rf-0" class="ring-pill active">Todos</button>
            <button onclick="setRingFilter(1)" id="rf-1" class="ring-pill" title="45–58 dB medidos con micrófono">Bajo 45–58 dB (<span id="rfCount-1">5</span>)</button>
            <button onclick="setRingFilter(2)" id="rf-2" class="ring-pill" title="59–72 dB medidos con micrófono">Medio 59–72 dB (<span id="rfCount-2">10</span>)</button>
            <button onclick="setRingFilter(3)" id="rf-3" class="ring-pill" title="73–88 dB medidos con micrófono">Alto 73–88 dB (<span id="rfCount-3">9</span>)</button>
        </div>

        <!-- Indicador de Ecuación Activa (n, m) de Bourke / Ponce Campuzano -->
        <div id="activeModeFormulaBadge" class="poster-text text-[10px] font-medium tracking-[0.08em] text-[#111111]/75">
            Modo Chladni (n, m): Superposición ponderada del lugar
        </div>

        <!-- Etiqueta cuando se aísla a 1 encuesta/micrófono -->
        <button id="clearPersonBtn" onclick="clearIsolatedPerson()" class="interactive hidden px-3.5 py-1 rounded-full bg-[#111111] text-[#FAF9F5] text-[10px] font-semibold tracking-[0.12em] uppercase shadow-md">
            Restaurar grupo ✕
        </button>
    </div>

    <!-- ==========================================================================
         ESQUINA INFERIOR IZQUIERDA (bottom: 48px, left: 52px)
         Diagramación idéntica al bloque izquierdo de "Sound Image Handel" en Negro Carbón
         ========================================================================== -->
    <div class="ui-corner bottom-8 left-7 sm:bottom-12 sm:left-13 max-w-lg poster-text">

        <!-- Bloque principal de 5 líneas con la jerarquía del afiche de referencia -->
        <div class="space-y-0.5 text-[#111111] leading-[1.30] tracking-[-0.01em]">
            <div id="posterLine1" class="text-xl sm:text-[26px] font-semibold">
                Cartografía Cimática
            </div>
            <div id="posterLine2" class="text-lg sm:text-[21px] font-normal">
                Encuestas y volumen con micrófono (dB)
            </div>
            <div id="posterLine3" class="text-base sm:text-[19px] font-light text-[#111111]/85">
                62 registros · Promedio 66.8 dB
            </div>
            <div id="posterLine4" class="text-base sm:text-[19px] font-light text-[#111111]/85">
                Sotomayor, Muelle Prat,
            </div>
            <div id="posterLine5" class="text-base sm:text-[19px] font-light text-[#111111]/85">
                Buenos Aires
            </div>
        </div>

        <!-- Leyenda cromática de los 4 Pictogramas (Arena coloreada + modo Chladni) -->
        <div class="mt-5 space-y-2.5">
            <div class="flex flex-wrap items-center gap-x-4 gap-y-1.5 text-[10.5px] font-semibold tracking-[0.05em]">
                <!-- Tránsito -->
                <button onclick="quickSelectPictogramFromLegend('transito')" class="interactive inline-flex items-center gap-1.5 text-[#B45309] hover:underline focus:outline-none" title="Patrón Reticular/Hexagonal (2,5) a (4,7)">
                    <span class="w-2.5 h-2.5 rounded-full bg-[#D97706]"></span>
                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 15h14l-1.5-5.5A2 2 0 0 0 15.6 8H8.4a2 2 0 0 0-1.9 1.5L5 15z"/><path d="M3 15h18v3H3z"/></svg>
                    <span>Tránsito</span>
                </button>
                <!-- Obras -->
                <button onclick="quickSelectPictogramFromLegend('obras')" class="interactive inline-flex items-center gap-1.5 text-[#C2410C] hover:underline focus:outline-none" title="Patrón Radial Fragmentado (3,7) a (5,9)">
                    <span class="w-2.5 h-2.5 rounded-full bg-[#EA580C]"></span>
                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 4l6 6-2.5 2.5-6-6L14 4z"/><path d="M4 20l8.5-8.5"/></svg>
                    <span>Obras</span>
                </button>
                <!-- Personas -->
                <button onclick="quickSelectPictogramFromLegend('personas')" class="interactive inline-flex items-center gap-1.5 text-[#0369A1] hover:underline focus:outline-none" title="Patrón Bipolar Abierto (1,2) a (2,3)">
                    <span class="w-2.5 h-2.5 rounded-full bg-[#0284C7]"></span>
                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="7.5" r="3"/><path d="M3.5 19c0-3 2.5-5.2 5.5-5.2s5.5 2.2 5.5 5.2"/></svg>
                    <span>Personas</span>
                </button>
                <!-- Naturaleza -->
                <button onclick="quickSelectPictogramFromLegend('naturaleza')" class="interactive inline-flex items-center gap-1.5 text-[#15803D] hover:underline focus:outline-none" title="Patrón Cuadrilobular Armónico (1,4) a (3,5)">
                    <span class="w-2.5 h-2.5 rounded-full bg-[#16A34A]"></span>
                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 15c2.5-2.8 5.5-2.8 8 0s5.5 2.8 8 0"/><path d="M12 3c-3 2-4 5-2 7 2-2 1-5-2-7z"/></svg>
                    <span>Naturaleza</span>
                </button>
            </div>

            <!-- Pie de dos líneas al estilo "All concerts of the new season..." -->
            <div class="interactive pt-0.5">
                <button id="posterSmallCta" onclick="handlePrimaryAction()" class="text-left group focus:outline-none">
                    <div id="smallCaption1" class="text-[11px] sm:text-xs font-semibold tracking-[0.02em] text-[#111111] cta-pulse group-hover:underline">
                        Click en la placa para ingresar al total →
                    </div>
                    <div id="smallCaption2" class="text-[11px] sm:text-xs font-normal tracking-[0.02em] text-[#111111]/70">
                        Volumen micrófono: Bajo (45–58 dB) · Medio (59–72 dB) · Alto (73–88 dB)
                    </div>
                </button>
            </div>
        </div>
    </div>

    <!-- ==========================================================================
         ESQUINA INFERIOR DERECHA (bottom: 48px, right: 52px)
         Firma limpia en dos líneas idéntica a "Berliner Philharmoniker" en Negro Carbón
         ========================================================================== -->
    <div class="ui-corner bottom-8 right-7 sm:bottom-12 sm:right-13 flex flex-col items-end gap-4 poster-text">

        <!-- Navegación rápida y limpia entre lugares -->
        <nav id="QuickPlaceNav" class="interactive hidden sm:flex items-center gap-5 text-[11px] font-medium tracking-[0.08em] text-[#111111]/70">
            <button onclick="goToStage('overview')" id="nav-overview" class="hover:text-[#111111] hover:underline transition-colors">
                Total (62)
            </button>
            <button onclick="enterPlaceDetail('sotomayor')" id="nav-sotomayor" class="hover:text-[#111111] hover:underline transition-colors">
                Sotomayor (24)
            </button>
            <button onclick="enterPlaceDetail('muelle')" id="nav-muelle" class="hover:text-[#111111] hover:underline transition-colors">
                Muelle Prat (20)
            </button>
            <button onclick="enterPlaceDetail('buenosaires')" id="nav-buenosaires" class="hover:text-[#111111] hover:underline transition-colors">
                Buenos Aires (18)
            </button>
        </nav>

        <!-- Firma editorial de dos líneas en negro carbón -->
        <div onclick="handlePrimaryAction()" class="interactive cursor-pointer text-right leading-[1.18] tracking-[-0.01em] text-[#111111]">
            <div id="brandRightLine1" class="text-lg sm:text-[23px] font-semibold">
                Visualización
            </div>
            <div id="brandRightLine2" class="text-lg sm:text-[23px] font-semibold">
                Datos en Arena
            </div>
        </div>
    </div>

    <script>
        /**
         * ============================================================================
         * 1. ECUACIÓN REAL DE BOURKE / PONCE CAMPUZANO Y WHIPPLE MUSEUM (12 MODOS (n, m))
         *    + COLOR DE ARENA CALIBRADO PARA ALTO CONTRASTE SOBRE FONDO BLANCO (#FAF9F5)
         * ============================================================================
         * Ecuación implícita de Chladni:
         * cos(n * pi * x / L) * cos(m * pi * y / L) - cos(m * pi * x / L) * cos(n * pi * y / L) = 0
         */
        const WAVE_TYPES = {
            transito: {
                key: 'transito',
                colorIndex: 0,
                pictogramName: 'Tránsito',
                waveQuality: 'Reticular / Hexagonal de Flujo',
                hex: '#D97706',
                hexLight: '#B45309',
                // Paleta de granos de arena pigmentados para Tránsito (Ámbar Profundo / Ocre Dorado sobre blanco)
                sandShades: [
                    'rgba(180, 83, 9, 0.96)',
                    'rgba(217, 119, 6, 0.94)',
                    'rgba(245, 158, 11, 0.90)',
                    'rgba(146, 64, 14, 0.88)'
                ],
                // Modos (n, m) según intensidad de micrófono (Bajo, Medio, Alto)
                modesByRing: {
                    1: { n: 2, m: 5, kRad: 2.15, label: '(n=2, m=5)' },
                    2: { n: 3, m: 6, kRad: 2.85, label: '(n=3, m=6)' },
                    3: { n: 4, m: 7, kRad: 3.55, label: '(n=4, m=7)' }
                },
                lobes: 6,
                emblemSides: 6,
                vibFreq: 1.38
            },
            obras: {
                key: 'obras',
                colorIndex: 1,
                pictogramName: 'Obras',
                waveQuality: 'Radial Fragmentada de Alta Frecuencia',
                hex: '#EA580C',
                hexLight: '#C2410C',
                // Paleta de granos de arena pigmentados para Obras (Terracota / Bermellón Vibrante sobre blanco)
                sandShades: [
                    'rgba(194, 65, 12, 0.96)',
                    'rgba(234, 88, 12, 0.94)',
                    'rgba(249, 115, 22, 0.90)',
                    'rgba(185, 28, 28, 0.88)'
                ],
                modesByRing: {
                    1: { n: 3, m: 7, kRad: 2.55, label: '(n=3, m=7)' },
                    2: { n: 4, m: 8, kRad: 3.25, label: '(n=4, m=8)' },
                    3: { n: 5, m: 9, kRad: 3.95, label: '(n=5, m=9)' }
                },
                lobes: 8,
                emblemSides: 8,
                vibFreq: 1.72
            },
            personas: {
                key: 'personas',
                colorIndex: 2,
                pictogramName: 'Personas',
                waveQuality: 'Bipolar / Hiperbólica Abierta',

        function precomputeFixedSummaries() {
            let allDbSum = 0;
            let allCount = 0;

            Object.keys(PLACES_DATA).forEach(key => {
                const people = PLACES_DATA[key].people;
                const total = people.length;
                const waveCounts = { transito: 0, obras: 0, personas: 0, naturaleza: 0 };
                let dbSum = 0;
                let minDb = 999;
                let maxDb = 0;

                people.forEach(p => {
                    waveCounts[p.wave]++;
                    dbSum += p.db;
                    if (p.db < minDb) minDb = p.db;
                    if (p.db > maxDb) maxDb = p.db;
                    allDbSum += p.db;
                    allCount++;
                });

                const avgDb = +(dbSum / total).toFixed(1);
                const weights = {
                    transito:   waveCounts.transito / total,
                    obras:      waveCounts.obras / total,
                    personas:   waveCounts.personas / total,
                    naturaleza: waveCounts.naturaleza / total
                };

                let dominantWave = 'naturaleza';
                let maxC = -1;
                Object.keys(waveCounts).forEach(w => {
                    if (waveCounts[w] > maxC) {
                        maxC = waveCounts[w];
                        dominantWave = w;
                    }
                });

                placeHarmonicSummary[key] = { total, waveCounts, weights, dominantWave, avgDb, minDb, maxDb };
            });

            globalAverageDb = +(allDbSum / allCount).toFixed(1);
        }

        function handleResize() {
            width = window.innerWidth;
            height = window.innerHeight;
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
        }

        function initSandGrains() {
            const placeKeys = ['sotomayor', 'muelle', 'buenosaires'];

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                pSize[i] = (i % 5 === 0) ? 1.72 : 1.28;
                pPhase[i] = (i * 0.6180339887) % (Math.PI * 2);
                pShadeVariant[i] = i % 4;

                const mod = i % 62;
                let zIdx = 0;
                if (mod < 24) zIdx = 0;
                else if (mod < 44) zIdx = 1;
                else zIdx = 2;
                pZoneAssign[i] = zIdx;

                // Asignar el color de pictograma de cada grano proporcionalmente a los datos reales de esa zona
                const pKey = placeKeys[zIdx];
                const people = PLACES_DATA[pKey].people;
                const personSample = people[i % people.length];
                pWaveColor[i] = WAVE_TYPES[personSample.wave].colorIndex;
            }
            reassignGrainColorsForStage();
            distributeParticlesForCurrentStage();
        }

        /**
         * Asigna la proporción exacta de colores de arena según la etapa o el filtro activo
         */
        function reassignGrainColorsForStage() {
            if (currentStage === 'intro') {
                // En la portada se distribuyen proporcionalmente a las 62 encuestas globales
                const allPeople = [
                    ...PLACES_DATA.sotomayor.people,
                    ...PLACES_DATA.muelle.people,
                    ...PLACES_DATA.buenosaires.people
                ];
                for (let i = 0; i < PARTICLE_COUNT; i++) {
                    const p = allPeople[i % allPeople.length];
                    pWaveColor[i] = WAVE_TYPES[p.wave].colorIndex;
                }
                return;
            }

            if (currentStage === 'overview') {
                const placeKeys = ['sotomayor', 'muelle', 'buenosaires'];
                for (let i = 0; i < PARTICLE_COUNT; i++) {
                    const pKey = placeKeys[pZoneAssign[i]];
                    const people = PLACES_DATA[pKey].people;
                    const p = people[i % people.length];
                    pWaveColor[i] = WAVE_TYPES[p.wave].colorIndex;
                }
                return;
            }

            // Etapa 'detail': si hay una persona aislada o un pictograma filtrado, la arena adopta ese pigmento
            if (isolatedPerson) {
                const cIdx = WAVE_TYPES[isolatedPerson.wave].colorIndex;
                for (let i = 0; i < PARTICLE_COUNT; i++) {
                    pWaveColor[i] = cIdx;
                }
                return;
            }

            const filtered = getFilteredPeopleInActivePlace();
            const sourceList = filtered.length > 0 ? filtered : PLACES_DATA[activePlaceKey].people;
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const p = sourceList[i % sourceList.length];
                pWaveColor[i] = WAVE_TYPES[p.wave].colorIndex;
            }
        }

        /**
         * GEOMETRÍA DE LAS PLACAS Y DISTRIBUCIÓN DE PARTÍCULAS POR ETAPA
         */
        function getOverviewConstellationGeometry() {
            const isMobile = width < 768;
            const minDim = Math.min(width, height);
            const baseR = isMobile ? minDim * 0.165 : minDim * 0.145;

            const hubX = width * 0.49;
            const hubY = height * 0.47;

            if (isMobile) {
                return {
                    hub: { cx: width * 0.50, cy: height * 0.46, radius: baseR * 0.36 },
                    zones: [
                        { key: 'sotomayor',   cx: width * 0.30, cy: height * 0.29, radius: baseR * 1.16 },
                        { key: 'muelle',      cx: width * 0.72, cy: height * 0.43, radius: baseR * 1.00 },
                        { key: 'buenosaires', cx: width * 0.43, cy: height * 0.65, radius: baseR * 0.88 }
                    ]
                };
            }

            return {
                hub: { cx: hubX, cy: hubY, radius: baseR * 0.38 },
                zones: [
                    { key: 'sotomayor',   cx: width * 0.29, cy: height * 0.34, radius: baseR * 1.22 },
                    { key: 'muelle',      cx: width * 0.71, cy: height * 0.41, radius: baseR * 1.04 },
                    { key: 'buenosaires', cx: width * 0.48, cy: height * 0.71, radius: baseR * 0.92 }
                ]
            };
        }

        function getSinglePlateGeometry(isIntro = false) {
            const cx = width * 0.50;
            const cy = height * 0.49;
            const scale = isIntro ? 0.44 : (width < 640 ? 0.35 : 0.34);
            const radius = Math.min(width, height) * scale;
            return { cx, cy, radius };
        }

        function distributeParticlesForCurrentStage() {
            if (currentStage === 'overview') {
                const { zones } = getOverviewConstellationGeometry();
                for (let i = 0; i < PARTICLE_COUNT; i++) {
                    const z = zones[pZoneAssign[i]];
                    const a = (i * 1.6180339) % (Math.PI * 2);
                    const r = Math.sqrt(((i * 7919) % 10000) / 10000) * z.radius * 1.14;
                    px[i] = z.cx + Math.cos(a) * r;
                    py[i] = z.cy + Math.sin(a) * r;
                    vx[i] = 0;
                    vy[i] = 0;
                }
            } else {
                const plate = getSinglePlateGeometry(currentStage === 'intro');
                const spread = currentStage === 'intro' ? 1.42 : 1.12;
                for (let i = 0; i < PARTICLE_COUNT; i++) {
                    const a = (i * 1.6180339) % (Math.PI * 2);
                    const r = Math.sqrt(((i * 7919) % 10000) / 10000) * plate.radius * spread;
                    px[i] = plate.cx + Math.cos(a) * r;
                    py[i] = plate.cy + Math.sin(a) * r;
                    vx[i] = 0;
                    vy[i] = 0;
                }
            }
        }

        /**
         * ECUACIONES IMPLÍCITAS DE CHLADNI (BOURKE / PONCE CAMPUZANO / WHIPPLE MUSEUM)
         * cos(n * pi * x / L) * cos(m * pi * y / L) - cos(m * pi * x / L) * cos(n * pi * y / L) = 0
         */
        function evaluateBourkeChladniMode(waveTypeObj, ringLevel, nx, ny, rNorm, theta, freqMod = 1.0, phaseShift = 0.0) {
            const lvl = Math.min(3, Math.max(1, ringLevel || 2));
            const mode = waveTypeObj.modesByRing[lvl];
            const n = mode.n * freqMod;
            const m = mode.m * freqMod;

            // Término implícito cartesiano de Bourke
            const chladniRect =
                Math.cos(n * Math.PI * nx * 0.72) * Math.cos(m * Math.PI * ny * 0.72) -
                Math.cos(m * Math.PI * nx * 0.72) * Math.cos(n * Math.PI * ny * 0.72);

            // Término armónico polar para placas circulares (Whipple Museum)
            const env = Math.min(1.0, Math.max(0.0, (rNorm - 0.16) * 1.45));
            const polarWave = Math.sin(
                mode.kRad * Math.PI * rNorm +
                0.45 * env * Math.cos(waveTypeObj.lobes * theta) * Math.PI +
                phaseShift
            );

            return chladniRect * 0.54 + polarWave * 0.46;
        }

        function evaluateIntroPosterWave(x, y, cx, cy, radius, breath = 0.0) {
            const nx = (x - cx) / radius;
            const ny = (y - cy) / radius;
            const r = Math.hypot(nx, ny);
            const theta = Math.atan2(ny, nx);

            if (r < 0.055) return 1.5;

            const env = Math.min(1.0, Math.max(0.0, (r - 0.25) * 1.42));
            const angular = 0.45 * env * Math.cos(4 * theta);
            return Math.sin(2.22 * Math.PI * r + angular * Math.PI + breath * 0.05);
        }

        function evaluateZoneTotalWave(placeKey, x, y, cx, cy, radius, breath = 0.0) {
            const nx = (x - cx) / radius;
            const ny = (y - cy) / radius;
            const r = Math.hypot(nx, ny);
            const theta = Math.atan2(ny, nx);

            if (r < 0.08) return 1.4;
            if (r > 1.04) return (r - 1.04) * 3.0;

            const w = placeHarmonicSummary[placeKey].weights;
            let val = 0;
            val += w.transito   * evaluateBourkeChladniMode(WAVE_TYPES.transito,   2, nx, ny, r, theta, 1.0, breath * 0.05);
            val += w.obras      * evaluateBourkeChladniMode(WAVE_TYPES.obras,      2, nx, ny, r, theta, 1.0, breath * 0.05);
            val += w.personas   * evaluateBourkeChladniMode(WAVE_TYPES.personas,   2, nx, ny, r, theta, 1.0, breath * 0.05);
            val += w.naturaleza * evaluateBourkeChladniMode(WAVE_TYPES.naturaleza, 2, nx, ny, r, theta, 1.0, breath * 0.05);

            const outerBoundary = Math.sin(Math.PI * (r / 1.02));
            return val * 0.85 + outerBoundary * 0.15;
        }

        function evaluateDetailPlateWave(x, y, cx, cy, radius, breath = 0.0) {
            const nx = (x - cx) / radius;
            const ny = (y - cy) / radius;
            const r = Math.hypot(nx, ny);
            const theta = Math.atan2(ny, nx);

            if (r < 0.068) return 1.5;
            if (r > 1.08) return (r - 1.08) * 3.2;

            if (isolatedPerson) {
                const wObj = WAVE_TYPES[isolatedPerson.wave];
                const ringObj = INTENSITY_RINGS[isolatedPerson.ring - 1];
                const personWave = evaluateBourkeChladniMode(
                    wObj,
                    isolatedPerson.ring,
                    nx,
                    ny,
                    r,
                    theta - isolatedPerson.angle,
                    isolatedPerson.freqMod,
                    breath * 0.06
                );
                const ringPull = Math.sin(((r - ringObj.radiusNorm) / 0.18) * Math.PI);
                return personWave * 0.72 + ringPull * 0.28;
            }

            const people = getFilteredPeopleInActivePlace();
            if (people.length === 0) return Math.sin(r * Math.PI * 3);

            const counts = { transito: 0, obras: 0, personas: 0, naturaleza: 0 };
            people.forEach(p => counts[p.wave]++);
            const total = people.length;
            const ringLvl = activeRingFilter > 0 ? activeRingFilter : 2;

            let waveSum = 0;
            if (counts.transito > 0)   waveSum += (counts.transito / total)   * evaluateBourkeChladniMode(WAVE_TYPES.transito,   ringLvl, nx, ny, r, theta, 1.0, breath * 0.05);
            if (counts.obras > 0)      waveSum += (counts.obras / total)      * evaluateBourkeChladniMode(WAVE_TYPES.obras,      ringLvl, nx, ny, r, theta, 1.0, breath * 0.05);
            if (counts.personas > 0)   waveSum += (counts.personas / total)   * evaluateBourkeChladniMode(WAVE_TYPES.personas,   ringLvl, nx, ny, r, theta, 1.0, breath * 0.05);
            if (counts.naturaleza > 0) waveSum += (counts.naturaleza / total) * evaluateBourkeChladniMode(WAVE_TYPES.naturaleza, ringLvl, nx, ny, r, theta, 1.0, breath * 0.05);

            if (activeRingFilter > 0) {
                const targetR = INTENSITY_RINGS[activeRingFilter - 1].radiusNorm;
                const distFromRing = Math.abs(r - targetR);
                if (distFromRing > 0.13) {
                    return (distFromRing - 0.06) * 2.4;
                }
            }
            return waveSum;
        }

        function stepSandSettlement(energyFactor, breath = 0.0) {
            if (energyFactor <= 0.001) return;
            const eps = 2.2;

            if (currentStage === 'intro') {
                const plate = getSinglePlateGeometry(true);
                for (let i = 0; i < PARTICLE_COUNT; i++) {
                    const isDust = (i % 10 === 0);
                    let x = px[i], y = py[i];

                    const w0 = Math.abs(evaluateIntroPosterWave(x, y, plate.cx, plate.cy, plate.radius, breath));
                    const wx = Math.abs(evaluateIntroPosterWave(x + eps, y, plate.cx, plate.cy, plate.radius, breath)) - w0;
                    const wy = Math.abs(evaluateIntroPosterWave(x, y + eps, plate.cx, plate.cy, plate.radius, breath)) - w0;

                    const pull = isDust ? 0.55 : 4.8;
                    vx[i] -= wx * pull;
                    vy[i] -= wy * pull;

                    const harmonicTremor = vibrationActive
                        ? Math.sin(simTime * 11.0 + pPhase[i]) * (0.26 + w0 * 1.45)
                        : 0;
                    const jitter = (w0 * 3.6 + 0.22) * energyFactor * (isDust ? 1.85 : 0.82);

                    vx[i] += (Math.random() - 0.5) * jitter + Math.cos(pPhase[i]) * harmonicTremor * 0.22;
                    vy[i] += (Math.random() - 0.5) * jitter + Math.sin(pPhase[i]) * harmonicTremor * 0.22;

                    vx[i] *= 0.64;
                    vy[i] *= 0.64;
                    px[i] += vx[i];
                    py[i] += vy[i];
                }
            } else if (currentStage === 'overview') {
                const { zones } = getOverviewConstellationGeometry();
                for (let i = 0; i < PARTICLE_COUNT; i++) {
                    const isDust = (i % 13 === 0);
                    const z = zones[pZoneAssign[i]];
                    let x = px[i], y = py[i];

                    const w0 = Math.abs(evaluateZoneTotalWave(z.key, x, y, z.cx, z.cy, z.radius, breath));
                    const wx = Math.abs(evaluateZoneTotalWave(z.key, x + eps, y, z.cx, z.cy, z.radius, breath)) - w0;
                    const wy = Math.abs(evaluateZoneTotalWave(z.key, x, y + eps, z.cx, z.cy, z.radius, breath)) - w0;

                    const pull = isDust ? 0.55 : 4.4;
                    vx[i] -= wx * pull;
                    vy[i] -= wy * pull;

                    const harmonicTremor = vibrationActive
                        ? Math.sin(simTime * 12.0 + pPhase[i]) * (0.24 + w0 * 1.35)
                        : 0;
                    const jitter = (w0 * 3.5 + 0.20) * energyFactor * (isDust ? 1.75 : 0.82);

                    vx[i] += (Math.random() - 0.5) * jitter + Math.cos(pPhase[i]) * harmonicTremor * 0.20;
                    vy[i] += (Math.random() - 0.5) * jitter + Math.sin(pPhase[i]) * harmonicTremor * 0.20;

                    vx[i] *= 0.65;
                    vy[i] *= 0.65;
                    px[i] += vx[i];
                    py[i] += vy[i];
                }
            } else {
                const plate = getSinglePlateGeometry(false);
                const dbBoost = activeRingFilter > 0 ? INTENSITY_RINGS[activeRingFilter - 1].vibBoost : 1.0;

                for (let i = 0; i < PARTICLE_COUNT; i++) {
                    const isDust = (i % 14 === 0);
                    let x = px[i], y = py[i];

                    const w0 = Math.abs(evaluateDetailPlateWave(x, y, plate.cx, plate.cy, plate.radius, breath));
                    const wx = Math.abs(evaluateDetailPlateWave(x + eps, y, plate.cx, plate.cy, plate.radius, breath)) - w0;
                    const wy = Math.abs(evaluateDetailPlateWave(x, y + eps, plate.cx, plate.cy, plate.radius, breath)) - w0;

                    const pull = isDust ? 0.55 : 4.6;
                    vx[i] -= wx * pull;
                    vy[i] -= wy * pull;

                    const harmonicTremor = vibrationActive
                        ? Math.sin(simTime * 13.0 * dbBoost + pPhase[i]) * (0.28 + w0 * 1.55) * dbBoost
                        : 0;
                    const jitter = (w0 * 3.8 + 0.22) * energyFactor * (isDust ? 1.85 : 0.84);

                    vx[i] += (Math.random() - 0.5) * jitter + Math.cos(pPhase[i]) * harmonicTremor * 0.24;
                    vy[i] += (Math.random() - 0.5) * jitter + Math.sin(pPhase[i]) * harmonicTremor * 0.24;

                    vx[i] *= 0.64;
                    vy[i] *= 0.64;
                    px[i] += vx[i];
                    py[i] += vy[i];
                }
            }
        }

        function settleImmediately() {
            for (let i = 0; i < 38; i++) {
                stepSandSettlement(0.75 * (1 - i / 38), 0.0);
            }
            settleEnergy = vibrationActive ? 0.22 : 0.0;
        }

        function triggerGentleReorganization() {
            reassignGrainColorsForStage();
            settleEnergy = 0.88;
            for (let s = 0; s < 15; s++) {
                stepSandSettlement(settleEnergy, 0.0);
                settleEnergy *= 0.91;
            }
        }

        /**
         * CONTROLADORES DE ETAPAS Y ACCIONES DE NAVEGACIÓN
         */
        function handlePrimaryAction() {
            if (currentStage === 'intro') {
                goToStage('overview');
            } else if (currentStage === 'overview') {
                enterPlaceDetail('sotomayor');
            } else {
                goToStage('overview');
            }
        }

        function handleTopEmblemClick() {
            if (currentStage === 'intro') {
                goToStage('overview');
            } else if (currentStage === 'detail') {
                goToStage('overview');
            } else {
                goToStage('intro');
            }
        }

        function stepBack() {
            if (currentStage === 'detail') {
                goToStage('overview');
            } else if (currentStage === 'overview') {
                goToStage('intro');
            }
        }

        function quickSelectPictogramFromLegend(waveKey) {
            if (currentStage !== 'detail') {
                activePlaceKey = 'sotomayor';
                activeRingFilter = 0;
                isolatedPerson = null;
                activeWaveFilter = waveKey;
                goToStage('detail');
                setWaveFilter(waveKey);
            } else {
                setWaveFilter(waveKey);
            }
        }

        function goToStage(stageName) {
            currentStage = stageName;
            isolatedPerson = null;
            hoveredItem = null;

            const topNav = document.getElementById('topNavActions');
            const detailFilters = document.getElementById('detailFiltersCorner');
            const quickNav = document.getElementById('QuickPlaceNav');
            const clearPersonBtn = document.getElementById('clearPersonBtn');

            clearPersonBtn.classList.add('hidden');

            if (stageName === 'intro') {
                topNav.classList.add('hidden');
                topNav.classList.remove('flex');
                detailFilters.classList.add('hidden');
                detailFilters.classList.remove('flex');
                quickNav.classList.add('hidden');
            } else if (stageName === 'overview') {
                topNav.classList.remove('hidden');
                topNav.classList.add('flex');
                detailFilters.classList.add('hidden');
                detailFilters.classList.remove('flex');
                quickNav.classList.remove('hidden');
            } else if (stageName === 'detail') {
                topNav.classList.remove('hidden');
                topNav.classList.add('flex');
                detailFilters.classList.remove('hidden');
                detailFilters.classList.add('flex');
                quickNav.classList.remove('hidden');
            }

            distributeParticlesForCurrentStage();
            triggerGentleReorganization();
            updatePosterTypography();
            updateHarmonicEmblem();
        }

        function enterPlaceDetail(placeKey) {
            activePlaceKey = placeKey;
            activeWaveFilter = 'todas';
            activeRingFilter = 0;
            isolatedPerson = null;
            goToStage('detail');
            updateFilterButtonsState();
        }

        function renderLoop() {
            simTime += 0.035;

            const steadyFloor = vibrationActive ? 0.22 : 0.0;
            if (settleEnergy > steadyFloor) {
                settleEnergy = Math.max(steadyFloor, settleEnergy * 0.92);
            } else {
                settleEnergy = steadyFloor;
            }

            const breath = vibrationActive ? Math.sin(simTime * 1.8) : 0.0;
            if (settleEnergy > 0.001) {
                stepSandSettlement(settleEnergy, breath);
            }

            // Fondo blanco papel cálido para realzar los pigmentos y las ondas de arena
            ctx.fillStyle = '#FAF9F5';
            ctx.fillRect(0, 0, width, height);

            // Dibujar los 28,000 granos de arena (Pigmentados por Pictograma o Basalto Oscuro)
            if (pigmentModeActive) {
                for (let wIdx = 0; wIdx < 4; wIdx++) {
                    const waveObj = WAVE_TYPES[WAVE_KEYS_ORDER[wIdx]];
                    const shades = waveObj.sandShades;

                    for (let sh = 0; sh < 4; sh++) {
                        ctx.fillStyle = shades[sh];
                        ctx.beginPath();
                        for (let i = sh; i < PARTICLE_COUNT; i += 4) {
                            if (pWaveColor[i] === wIdx) {
                                const s = pSize[i];
                                ctx.rect(px[i], py[i], s, s);
                            }
                        }
                        ctx.fill();
                    }
                }
            } else {
                for (let sh = 0; sh < NATURAL_QUARTZ_SHADES.length; sh++) {
                    ctx.fillStyle = NATURAL_QUARTZ_SHADES[sh];
                    ctx.beginPath();
                    for (let i = sh; i < PARTICLE_COUNT; i += NATURAL_QUARTZ_SHADES.length) {
                        const s = pSize[i];
                        ctx.rect(px[i], py[i], s, s);
                    }
                    ctx.fill();
                }
            }

            const boltJitterX = vibrationActive ? Math.cos(simTime * 24) * 0.35 : 0;
            const boltJitterY = vibrationActive ? Math.sin(simTime * 28) * 0.35 : 0;

            if (currentStage === 'intro') {
                const plate = getSinglePlateGeometry(true);
                drawHexBolt(plate.cx + boltJitterX, plate.cy + boltJitterY, 11.5);
            } else if (currentStage === 'overview') {
                renderOverviewConstellation(boltJitterX, boltJitterY);
            } else {
                renderDetailOverlay(boltJitterX, boltJitterY);
            }

            requestAnimationFrame(renderLoop);
        }

        // Etapa 1: Los 3 lugares en diversas alturas y tamaños con su promedio en dB sobre fondo blanco
        function renderOverviewConstellation(boltJitterX, boltJitterY) {
            const { hub, zones } = getOverviewConstellationGeometry();

            ctx.save();

            zones.forEach(z => {
                const isHovered = hoveredItem && hoveredItem.type === 'zone' && hoveredItem.key === z.key;
                ctx.beginPath();
                ctx.setLineDash([3, 7]);
                ctx.strokeStyle = isHovered ? 'rgba(17, 17, 17, 0.78)' : 'rgba(17, 17, 17, 0.25)';
                ctx.lineWidth = isHovered ? 1.6 : 1.0;
                ctx.moveTo(hub.cx, hub.cy);
                ctx.lineTo(z.cx, z.cy);
                ctx.stroke();
            });
            ctx.setLineDash([]);

            const hubPulse = vibrationActive ? Math.sin(simTime * 3.2) * 1.2 : 0;
            ctx.beginPath();
            ctx.arc(hub.cx, hub.cy, 31 + hubPulse, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(250, 249, 245, 0.94)';
            ctx.fill();
            ctx.strokeStyle = 'rgba(17, 17, 17, 0.65)';
            ctx.lineWidth = 1.3;
            ctx.stroke();

            ctx.textAlign = 'center';
            ctx.fillStyle = '#111111';
            ctx.font = '600 10.5px Montserrat';
            ctx.fillText('TOTAL N=62', hub.cx, hub.cy - 3);
            ctx.font = '500 9.5px Montserrat';
            ctx.fillStyle = 'rgba(17, 17, 17, 0.72)';
            ctx.fillText(`${globalAverageDb} dB prom.`, hub.cx, hub.cy + 10);

            zones.forEach((z, idx) => {
                const place = PLACES_DATA[z.key];
                const summary = placeHarmonicSummary[z.key];
                const domWave = WAVE_TYPES[summary.dominantWave];
                const isHovered = hoveredItem && hoveredItem.type === 'zone' && hoveredItem.key === z.key;
                const ringVib = vibrationActive ? Math.sin(simTime * 4.5 + idx * 1.7) * 0.95 : 0;

                ctx.beginPath();
                ctx.arc(z.cx, z.cy, z.radius * 1.02 + ringVib, 0, Math.PI * 2);
                ctx.strokeStyle = isHovered ? domWave.hex : 'rgba(17, 17, 17, 0.26)';
                ctx.lineWidth = isHovered ? 2.2 : 1.1;
                ctx.stroke();

                drawHexBolt(z.cx + boltJitterX, z.cy + boltJitterY, 8.5 * (z.radius / 115));

                const labelY = z.cy - z.radius - 18;
                ctx.textAlign = 'center';
                ctx.fillStyle = '#111111';
                ctx.font = isHovered ? '600 13px Montserrat' : '600 12px Montserrat';
                ctx.fillText(`${place.name} (${summary.total}) · ${summary.avgDb} dB`, z.cx, labelY);

                ctx.fillStyle = isHovered ? '#111111' : domWave.hexLight;
                ctx.font = isHovered ? '600 10.5px Montserrat' : '500 10.5px Montserrat';
                ctx.fillText(
                    isHovered
                        ? 'Click para abrir encuestas y niveles dB →'
                        : `Predomina: ${domWave.pictogramName}`,
                    z.cx,
                    z.cy + z.radius + 20
                );
            });

            ctx.restore();
        }

        // Etapa 2: Placa del lugar con sus 3 círculos de volumen en dB y ondas coloreadas por pictograma sobre fondo blanco
        function renderDetailOverlay(boltJitterX, boltJitterY) {
            const plate = getSinglePlateGeometry(false);
            const place = PLACES_DATA[activePlaceKey];
            const filteredPeople = getFilteredPeopleInActivePlace();
            const filteredIds = new Set(filteredPeople.map(p => p.id));

            ctx.save();

            // 1. Los 3 Círculos concéntricos del volumen medido con micrófono (BAJO, MEDIO, ALTO dB)
            INTENSITY_RINGS.forEach(ring => {
                const rPx = plate.radius * ring.radiusNorm;
                const isSelected = (activeRingFilter === ring.level);
                const isHovered = (hoveredItem && hoveredItem.type === 'ring' && hoveredItem.level === ring.level);

                ctx.beginPath();
                ctx.arc(plate.cx, plate.cy, rPx, 0, Math.PI * 2);

                if (isSelected || isHovered) {
                    ctx.strokeStyle = '#111111';
                    ctx.lineWidth = 1.85;
                    ctx.setLineDash([]);
                } else {
                    ctx.strokeStyle = activeRingFilter === 0 ? 'rgba(17, 17, 17, 0.28)' : 'rgba(17, 17, 17, 0.10)';
                    ctx.lineWidth = 1.0;
                    ctx.setLineDash([4, 7]);
                }
                ctx.stroke();
                ctx.setLineDash([]);

                // Etiqueta clara con rango de decibeles (dB) en el eje superior de cada círculo
                ctx.textAlign = 'center';
                ctx.font = (isSelected || isHovered) ? '700 10px Montserrat' : '600 9.2px Montserrat';
                ctx.fillStyle = (isSelected || isHovered) ? '#111111' : 'rgba(17, 17, 17, 0.65)';
                ctx.fillText(ring.short, plate.cx, plate.cy - rPx - 6);
            });

            // 2. Nodos de personas encuestadas + su onda individual coloreada según su pictograma
            place.people.forEach(person => {
                const isIncluded = filteredIds.has(person.id) && (!isolatedPerson || isolatedPerson.id === person.id);
                const isHighlighted = (hoveredItem && hoveredItem.type === 'person' && hoveredItem.person.id === person.id) ||
                                      (isolatedPerson && isolatedPerson.id === person.id);

                const ringInfo = INTENSITY_RINGS[person.ring - 1];
                const waveInfo = WAVE_TYPES[person.wave];
                const baseR = plate.radius * ringInfo.radiusNorm;

                // Amplitud de vibración escalada por los decibeles reales medidos con micrófono (person.db)
                const dbNorm = (person.db - 45) / 43; // 0.0 a 1.0
                const livePhase = vibrationActive ? simTime * 5.4 * waveInfo.vibFreq : 0;
                const nodeRadialTremor = vibrationActive
                    ? Math.sin(livePhase + person.angle * 3.0) * (0.9 + dbNorm * 2.4)
                    : 0;

                const pxNode = plate.cx + Math.cos(person.angle) * (baseR + nodeRadialTremor);
                const pyNode = plate.cy + Math.sin(person.angle) * (baseR + nodeRadialTremor);

                if (isIncluded) {
                    ctx.beginPath();
                    const arcSpan = isHighlighted ? Math.PI * 2 : 0.58;
                    const steps = isHighlighted ? 160 : 40;
                    const waveAmpPx = (5.5 + dbNorm * 11.5) * (isHighlighted ? 1.45 : 0.85);

                    for (let s = 0; s <= steps; s++) {
                        const a = (person.angle - arcSpan / 2) + (s / steps) * arcSpan;
                        const env = isHighlighted ? 1.0 : Math.sin((s / steps) * Math.PI);
                        const osc = Math.sin((a - person.angle) * waveInfo.lobes * 2.4 * person.freqMod + livePhase);
                        const rOsc = baseR + osc * waveAmpPx * env;
                        const wx = plate.cx + Math.cos(a) * rOsc;
                        const wy = plate.cy + Math.sin(a) * rOsc;
                        if (s === 0) ctx.moveTo(wx, wy);
                        else ctx.lineTo(wx, wy);
                    }
                    ctx.strokeStyle = isHighlighted ? waveInfo.hexLight : waveInfo.hex;
                    ctx.globalAlpha = isHighlighted ? 0.98 : 0.72;
                    ctx.lineWidth = isHighlighted ? 2.3 : 1.4;
                    ctx.stroke();
                    ctx.globalAlpha = 1.0;
                }

                // Punto coloreado de la encuesta/micrófono según su pictograma
                const rDot = isHighlighted ? 6.6 : (isIncluded ? 4.4 : 2.0);
                ctx.beginPath();
                ctx.arc(pxNode, pyNode, rDot, 0, Math.PI * 2);
                ctx.fillStyle = isHighlighted ? '#111111' : (isIncluded ? waveInfo.hex : 'rgba(17, 17, 17, 0.16)');
                ctx.fill();

                if (isIncluded) {
                    ctx.lineWidth = isHighlighted ? 2.0 : 1.1;
                    ctx.strokeStyle = isHighlighted ? waveInfo.hex : '#FAF9F5';
                    ctx.stroke();
                }
            });

            // 3. Perno metálico central con micro-vibración
            drawHexBolt(plate.cx + boltJitterX, plate.cy + boltJitterY, 10.5);

            ctx.restore();
        }

        function drawHexBolt(cx, cy, hexRadius) {
            ctx.save();
            ctx.translate(cx, cy);

            ctx.beginPath();
            ctx.arc(1.5, 2.2, hexRadius * 1.32, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(17, 17, 17, 0.18)';
            ctx.fill();

            ctx.beginPath();
            ctx.arc(0, 0, hexRadius * 1.18, 0, Math.PI * 2);
            ctx.fillStyle = '#27272A';
            ctx.fill();
            ctx.lineWidth = 1;
            ctx.strokeStyle = '#111111';
            ctx.stroke();

            ctx.beginPath();
            for (let s = 0; s < 6; s++) {
                const ang = (s * Math.PI) / 3 - Math.PI / 6;
                const hx = Math.cos(ang) * hexRadius;
                const hy = Math.sin(ang) * hexRadius;
                if (s === 0) ctx.moveTo(hx, hy);
                else ctx.lineTo(hx, hy);
            }
            ctx.closePath();

            const grad = ctx.createLinearGradient(-hexRadius, -hexRadius, hexRadius, hexRadius);
            grad.addColorStop(0, '#F4F4F5');
            grad.addColorStop(0.5, '#A1A1AA');
            grad.addColorStop(1, '#3F3F46');
            ctx.fillStyle = grad;
            ctx.fill();
            ctx.lineWidth = 0.9;
            ctx.strokeStyle = '#18181B';
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(0, 0, hexRadius * 0.46, 0, Math.PI * 2);
            ctx.fillStyle = '#E4E4E7';
            ctx.fill();
            ctx.lineWidth = 1;
            ctx.strokeStyle = '#27272A';
            ctx.stroke();

            ctx.restore();
        }

        function getFilteredPeopleInActivePlace() {
            const all = PLACES_DATA[activePlaceKey].people;
            return all.filter(p => {
                const matchWave = (activeWaveFilter === 'todas' || p.wave === activeWaveFilter);
                const matchRing = (activeRingFilter === 0 || p.ring === activeRingFilter);
                return matchWave && matchRing;
            });
        }

        function setWaveFilter(waveKey) {
            activeWaveFilter = waveKey;
            isolatedPerson = null;
            document.getElementById('clearPersonBtn').classList.add('hidden');
            updateFilterButtonsState();
            triggerGentleReorganization();
            updatePosterTypography();
            updateHarmonicEmblem();
        }

        function setRingFilter(ringLevel) {
            activeRingFilter = (activeRingFilter === ringLevel && ringLevel !== 0) ? 0 : ringLevel;
            isolatedPerson = null;
            document.getElementById('clearPersonBtn').classList.add('hidden');
            updateFilterButtonsState();
            triggerGentleReorganization();
            updatePosterTypography();
            updateHarmonicEmblem();
        }

        function isolateSinglePerson(personObj) {
            isolatedPerson = personObj;
            document.getElementById('clearPersonBtn').classList.remove('hidden');
            triggerGentleReorganization();
            updatePosterTypography();
            updateHarmonicEmblem();
        }

        function clearIsolatedPerson() {
            isolatedPerson = null;
            document.getElementById('clearPersonBtn').classList.add('hidden');
            triggerGentleReorganization();
            updatePosterTypography();
            updateHarmonicEmblem();
        }

        function updateFilterButtonsState() {
            const place = PLACES_DATA[activePlaceKey];
            const summary = placeHarmonicSummary[activePlaceKey];

            document.getElementById('wfCount-todas').textContent = summary.total;
            WAVE_KEYS_ORDER.forEach(wKey => {
                const count = place.people.filter(p =>
                    p.wave === wKey && (activeRingFilter === 0 || p.ring === activeRingFilter)
                ).length;
                document.getElementById('wfCount-' + wKey).textContent = count;
            });

            for (let r = 1; r <= 3; r++) {
                const count = place.people.filter(p =>
                    p.ring === r && (activeWaveFilter === 'todas' || p.wave === activeWaveFilter)
                ).length;
                document.getElementById('rfCount-' + r).textContent = count;
            }

            ['todas', ...WAVE_KEYS_ORDER].forEach(wKey => {
                const btn = document.getElementById('wf-' + wKey);
                if (btn) btn.classList.toggle('active', activeWaveFilter === wKey);
            });

            for (let r = 0; r <= 3; r++) {
                const btn = document.getElementById('rf-' + r);
                if (btn) btn.classList.toggle('active', activeRingFilter === r);
            }

            // Actualizar etiqueta de modo matemático (n, m) de Bourke / Ponce Campuzano
            const badge = document.getElementById('activeModeFormulaBadge');
            if (badge) {
                const ringLvl = activeRingFilter > 0 ? activeRingFilter : 2;
                if (isolatedPerson) {
                    const wObj = WAVE_TYPES[isolatedPerson.wave];
                    const mode = wObj.modesByRing[isolatedPerson.ring];
                    badge.textContent = `Ecuación Chladni ${wObj.pictogramName}: ${mode.label} · Micrófono ${isolatedPerson.db} dB`;
                } else if (activeWaveFilter !== 'todas') {
                    const wObj = WAVE_TYPES[activeWaveFilter];
                    const mode = wObj.modesByRing[ringLvl];
                    badge.textContent = `Ecuación Chladni ${wObj.pictogramName}: ${mode.label} · ${wObj.waveQuality}`;
                } else {
                    badge.textContent = `Modo Chladni (n, m): Superposición ponderada · Promedio ${summary.avgDb} dB`;
                }
            }
        }

        /**
         * ============================================================================
         * 6. ACTUALIZACIÓN DEL TEXTO DE LAS ESQUINAS (CON LECTURAS EN DECIBELES dB)
         * ============================================================================
         */
        function updatePosterTypography() {
            const l1 = document.getElementById('posterLine1');
            const l2 = document.getElementById('posterLine2');
            const l3 = document.getElementById('posterLine3');
            const l4 = document.getElementById('posterLine4');
            const l5 = document.getElementById('posterLine5');
            const c1 = document.getElementById('smallCaption1');
            const c2 = document.getElementById('smallCaption2');

            if (hoveredItem) {
                if (hoveredItem.type === 'zone') {
                    const p = PLACES_DATA[hoveredItem.key];
                    const s = placeHarmonicSummary[hoveredItem.key];
                    l1.textContent = p.name;
                    l2.textContent = `${s.total} encuestas · Micrófono ${s.avgDb} dB prom.`;
                    l3.textContent = `Rango: ${s.minDb} a ${s.maxDb} dB (${WAVE_TYPES[s.dominantWave].pictogramName})`;
                    l4.textContent = `Tránsito ${s.waveCounts.transito} · Obras ${s.waveCounts.obras}`;
                    l5.textContent = `Personas ${s.waveCounts.personas} · Naturaleza ${s.waveCounts.naturaleza}`;
                    c1.textContent = 'Click en este círculo para desglosar →';
                    c2.textContent = '3 anillos de volumen (dB) y 4 colores de arena';
                    return;
                }
                if (hoveredItem.type === 'person') {
                    const per = hoveredItem.person;
                    const w = WAVE_TYPES[per.wave];
                    const ringObj = INTENSITY_RINGS[per.ring - 1];
                    const mode = w.modesByRing[per.ring];
                    l1.textContent = `Encuesta ${per.id} · ${per.db} dB`;
                    l2.textContent = `Pictograma: ${w.pictogramName} ${mode.label}`;
                    l3.textContent = `${w.waveQuality}`;
                    l4.textContent = `Volumen Micrófono: ${ringObj.name} (${ringObj.dbRange})`;
                    l5.textContent = per.note;
                    c1.textContent = 'Click para aislar este patrón (n, m) en la arena →';
                    c2.textContent = PLACES_DATA[activePlaceKey].name;
                    return;
                }
                if (hoveredItem.type === 'ring') {
                    const ringObj = INTENSITY_RINGS[hoveredItem.level - 1];
                    const place = PLACES_DATA[activePlaceKey];
                    const inRing = place.people.filter(p => p.ring === hoveredItem.level);
                    const avgRingDb = inRing.length
                        ? (inRing.reduce((acc, item) => acc + item.db, 0) / inRing.length).toFixed(1)
                        : '0.0';
                    l1.textContent = `${place.name} · Volumen ${ringObj.name}`;
                    l2.textContent = `${inRing.length} registros · Promedio ${avgRingDb} dB`;
                    l3.textContent = ringObj.label;
                    l4.textContent = 'Medición de micrófono en terreno';
                    l5.textContent = place.subtitle;
                    c1.textContent = `Click para aislar el anillo ${ringObj.name} (${ringObj.dbRange}) →`;
                    c2.textContent = '3 niveles: Bajo · Medio · Alto';
                    return;
                }
            }

            if (currentStage === 'intro') {
                l1.textContent = 'Cartografía Cimática';
                l2.textContent = 'Encuestas y volumen con micrófono (dB)';
                l3.textContent = `62 registros · Promedio ${globalAverageDb} dB`;
                l4.textContent = 'Sotomayor, Muelle Prat,';
                l5.textContent = 'Buenos Aires';
                c1.textContent = 'Click en la placa para ingresar al total →';
                c2.textContent = 'Volumen micrófono: Bajo (45–58 dB) · Medio (59–72 dB) · Alto (73–88 dB)';
                return;
            }

            if (currentStage === 'overview') {
                const sSoto = placeHarmonicSummary.sotomayor;
                const sMuelle = placeHarmonicSummary.muelle;
                const sBsAs = placeHarmonicSummary.buenosaires;
                l1.textContent = 'Resonancia Total';
                l2.textContent = `62 encuestas · Promedio ${globalAverageDb} dB`;
                l3.textContent = `Sotomayor (24 · ${sSoto.avgDb} dB)`;
                l4.textContent = `Muelle Prat (20 · ${sMuelle.avgDb} dB),`;
                l5.textContent = `Buenos Aires (18 · ${sBsAs.avgDb} dB)`;
                c1.textContent = 'Selecciona uno de los 3 lugares en la placa →';
                c2.textContent = 'Arena coloreada según proporción de cada pictograma';
                return;
            }

            // Etapa 2: Lugar en detalle
            const place = PLACES_DATA[activePlaceKey];
            const summary = placeHarmonicSummary[activePlaceKey];
            const filtered = getFilteredPeopleInActivePlace();
            const filteredAvgDb = filtered.length
                ? (filtered.reduce((acc, item) => acc + item.db, 0) / filtered.length).toFixed(1)
                : summary.avgDb;

            if (isolatedPerson) {
                const w = WAVE_TYPES[isolatedPerson.wave];
                const ringObj = INTENSITY_RINGS[isolatedPerson.ring - 1];
                const mode = w.modesByRing[isolatedPerson.ring];
                l1.textContent = `${place.name} · ${isolatedPerson.id}`;
                l2.textContent = `${w.pictogramName} ${mode.label} · ${isolatedPerson.db} dB`;
                l3.textContent = `${w.waveQuality} · Nivel ${ringObj.name}`;
                l4.textContent = isolatedPerson.note;
                l5.textContent = 'Patrón Chladni individual aislado';
                c1.textContent = 'Click para volver al total del lugar →';
                c2.textContent = `${summary.total} registros en ${place.name}`;
                return;
            }

            const ringLvl = activeRingFilter > 0 ? activeRingFilter : 2;
            l1.textContent = place.name;
            l2.textContent = `${filtered.length} de ${summary.total} encuestas · ${filteredAvgDb} dB prom.`;
            l3.textContent = activeWaveFilter === 'todas'
                ? `Predomina: ${WAVE_TYPES[summary.dominantWave].pictogramName}`
                : `Pictograma: ${WAVE_TYPES[activeWaveFilter].pictogramName} ${WAVE_TYPES[activeWaveFilter].modesByRing[ringLvl].label}`;
            l4.textContent = activeRingFilter === 0
                ? '3 niveles micrófono: Bajo · Medio · Alto (dB)'
                : `${INTENSITY_RINGS[activeRingFilter - 1].label}`;
            l5.textContent = place.subtitle;
            c1.textContent = 'Filtra arriba por pictograma o volumen en dB →';
            c2.textContent = 'Click aquí para volver a los 3 territorios';
        }

        function updateHarmonicEmblem() {
            const svg = document.getElementById('harmonicEmblem');
            let weights = { naturaleza: 0.34, transito: 0.28, personas: 0.24, obras: 0.14 };

            if (currentStage === 'detail') {
                const filtered = getFilteredPeopleInActivePlace();
                const total = Math.max(1, filtered.length);
                weights = { naturaleza: 0, transito: 0, personas: 0, obras: 0 };
                filtered.forEach(p => weights[p.wave] += 1 / total);
            }

            let html = '';
            WAVE_KEYS_ORDER.forEach((k, idx) => {
                const wInfo = WAVE_TYPES[k];
                const ratio = weights[k];
                const radius = 20 + ratio * 26;
                const sides = Math.max(4, wInfo.emblemSides);
                const rot = (idx * 19 * Math.PI) / 180;

                let pts = [];
                for (let s = 0; s < sides; s++) {
                    const a = (s * 2 * Math.PI) / sides + rot - Math.PI / 2;
                    pts.push(`${(Math.cos(a) * radius).toFixed(1)},${(Math.sin(a) * radius).toFixed(1)}`);
                }

                const isHighlighted = (activeWaveFilter === 'todas' || activeWaveFilter === k);
                const opacity = isHighlighted ? 0.94 : 0.22;
                const strokeColor = pigmentModeActive ? wInfo.hex : '#111111';
                html += `<polygon points="${pts.join(' ')}" fill="none" stroke="${strokeColor}" stroke-width="1.8" opacity="${opacity}" />`;
            });

            svg.innerHTML = html;
        }

        /**
         * ============================================================================
         * 7. INTERACCIÓN CON EL LIENZO
         * ============================================================================
         */
        function setupCanvasInteractions() {
            canvas.addEventListener('mousemove', (e) => {
                const mx = e.clientX;
                const my = e.clientY;

                if (currentStage === 'intro') {
                    canvas.style.cursor = 'pointer';
                    return;
                }

                if (currentStage === 'overview') {
                    const { zones } = getOverviewConstellationGeometry();
                    let found = null;
                    for (let z of zones) {
                        if (Math.hypot(mx - z.cx, my - z.cy) <= z.radius * 1.08) {
                            found = z;
                            break;
                        }
                    }
                    const prevKey = hoveredItem ? hoveredItem.key : null;
                    hoveredItem = found ? { type: 'zone', key: found.key } : null;
                    canvas.style.cursor = found ? 'pointer' : 'default';
                    if ((hoveredItem ? hoveredItem.key : null) !== prevKey) {
                        updatePosterTypography();
                    }
                    return;
                }

                // Etapa 2: Detalle del lugar
                const plate = getSinglePlateGeometry(false);
                const place = PLACES_DATA[activePlaceKey];
                let foundPerson = null;
                let minDist = 14;

                for (let p of place.people) {
                    const rPx = plate.radius * INTENSITY_RINGS[p.ring - 1].radiusNorm;
                    const pxNode = plate.cx + Math.cos(p.angle) * rPx;
                    const pyNode = plate.cy + Math.sin(p.angle) * rPx;
                    const d = Math.hypot(mx - pxNode, my - pyNode);
                    if (d < minDist) {
                        minDist = d;
                        foundPerson = p;
                    }
                }

                if (foundPerson) {
                    canvas.style.cursor = 'pointer';
                    hoveredItem = { type: 'person', person: foundPerson };
                    updatePosterTypography();
                    return;
                }

                const distCenter = Math.hypot(mx - plate.cx, my - plate.cy);
                let foundRing = null;
                for (let ring of INTENSITY_RINGS) {
                    if (Math.abs(distCenter - plate.radius * ring.radiusNorm) < 9) {
                        foundRing = ring;
                        break;
                    }
                }

                if (foundRing) {
                    canvas.style.cursor = 'pointer';
                    hoveredItem = { type: 'ring', level: foundRing.level };
                    updatePosterTypography();
                } else {
                    canvas.style.cursor = 'default';
                    if (hoveredItem) {
                        hoveredItem = null;
                        updatePosterTypography();
                    }
                }
            });

            canvas.addEventListener('click', () => {
                if (currentStage === 'intro') {
                    goToStage('overview');
                    return;
                }

                if (currentStage === 'overview') {
                    if (hoveredItem && hoveredItem.type === 'zone') {
                        enterPlaceDetail(hoveredItem.key);
                    }
                    return;
                }

                if (currentStage === 'detail' && hoveredItem) {
                    if (hoveredItem.type === 'person') {
                        if (isolatedPerson && isolatedPerson.id === hoveredItem.person.id) {
                            clearIsolatedPerson();
                        } else {
                            isolateSinglePerson(hoveredItem.person);
                        }
                    } else if (hoveredItem.type === 'ring') {
                        setRingFilter(hoveredItem.level);
                    }
                }
            });
        }
    </script>
