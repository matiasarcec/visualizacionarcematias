<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartografía Cimática — Datos en Arena</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Exclusivamente Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Montserrat', 'sans-serif'],
                    },
                    colors: {
                        signal: '#EAB308',
                        signalSoft: '#FDE047',
                        plate: '#121110',
                        sandLight: '#FAF6EE'
                    }
                }
            }
        }
    </script>

    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            font-family: 'Montserrat', sans-serif;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #121110;
            color: #EAB308;
            -webkit-font-smoothing: antialiased;
        }

        /* Lienzo de simulación de arena de cuarzo */
        #sandCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Textura sutil de placa negra mate como el póster de referencia */
        .plate-vignette {
            position: absolute;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            background: radial-gradient(
                circle at 50% 50%,
                rgba(255, 250, 240, 0.01) 0%,
                rgba(16, 15, 14, 0.35) 75%,
                rgba(8, 7, 7, 0.78) 100%
            );
        }

        /* Sombra editorial limpia para máxima legibilidad sobre los granos de arena */
        .poster-text {
            text-shadow:
                0 2px 18px rgba(10, 9, 8, 0.96),
                0 1px 4px rgba(0, 0, 0, 0.98);
        }

        .ui-corner {
            position: fixed;
            z-index: 20;
            pointer-events: none;
        }
        .interactive {
            pointer-events: auto;
        }

        /* Botones de pictograma minimalistas sin cajas pesadas */
        .picto-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.55rem;
            padding: 0.45rem 0.85rem;
            border-radius: 9999px;
            border: 1px solid rgba(234, 179, 8, 0.28);
            background: rgba(18, 17, 16, 0.72);
            backdrop-filter: blur(6px);
            color: rgba(234, 179, 8, 0.85);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.08em;
            transition: all 0.22s ease;
        }
        .picto-btn:hover {
            border-color: #EAB308;
            color: #FAF6EE;
            transform: translateY(-1px);
        }
        .picto-btn.active {
            background: #EAB308;
            border-color: #EAB308;
            color: #121110;
            font-weight: 600;
        }

        /* Chips de los 3 círculos de intensidad (Bajo, Medio, Alto) */
        .ring-pill {
            padding: 0.34rem 0.78rem;
            border-radius: 9999px;
            border: 1px solid rgba(234, 179, 8, 0.24);
            background: rgba(18, 17, 16, 0.68);
            color: rgba(234, 179, 8, 0.78);
            font-size: 10.5px;
            font-weight: 500;
            letter-spacing: 0.1em;
            transition: all 0.2s ease;
        }
        .ring-pill:hover {
            border-color: #EAB308;
            color: #FAF6EE;
        }
        .ring-pill.active {
            border-color: #EAB308;
            background: rgba(234, 179, 8, 0.22);
            color: #FDE047;
            font-weight: 600;
        }

        /* Indicador de micro-vibración acústica */
        @keyframes acousticDot {
            0%, 100% { transform: scale(1); opacity: 0.95; }
            50% { transform: scale(1.35); opacity: 0.45; }
        }
        .vib-dot {
            animation: acousticDot 1.1s infinite ease-in-out;
        }

        /* Pulso sutil del llamado a la acción en la portada */
        @keyframes subtlePulse {
            0%, 100% { opacity: 0.95; transform: translateX(0); }
            50% { opacity: 0.6; transform: translateX(3px); }
        }
        .cta-pulse {
            animation: subtlePulse 2.8s infinite ease-in-out;
        }
    </style>
</head>
<body class="w-screen h-screen overflow-hidden select-none">

    <!-- LIENZO DE ARENA DE CUARZO -->
    <canvas id="sandCanvas"></canvas>
    <div class="plate-vignette"></div>

    <!-- ==========================================================================
         ESQUINA SUPERIOR IZQUIERDA (top: 44px, left: 52px)
         Emblema geométrico amarillo de polígonos superpuestos + Estado de Vibración
         ========================================================================== -->
    <div class="ui-corner top-8 left-8 sm:top-12 sm:left-14 flex items-center gap-5">
        <button onclick="handleTopEmblemClick()" class="interactive group text-left focus:outline-none" title="Cambiar etapa / Volver">
            <svg id="harmonicEmblem" width="82" height="82" viewBox="-52 -52 104 104" class="overflow-visible transition-transform duration-500 group-hover:scale-105">
                <!-- Polígonos amarillos superpuestos generados dinámicamente -->
            </svg>
        </button>

        <div class="flex flex-col items-start gap-2 poster-text">
            <!-- Control de vibración acústica en el lugar -->
            <button onclick="toggleVibrationMode()" id="vibBadgeBtn" class="interactive inline-flex items-center gap-2 px-3 py-1 rounded-full border border-[#EAB308]/35 bg-[#121110]/70 text-[#EAB308]/90 text-[10px] font-medium tracking-[0.14em] uppercase hover:border-[#EAB308] hover:text-[#FAF6EE] transition-all">
                <span id="vibIndicatorDot" class="w-1.5 h-1.5 rounded-full bg-[#EAB308] vib-dot"></span>
                <span id="vibStatusLabel">Vibración en el Lugar · Activa</span>
            </button>

            <!-- Botón minimalista de retorno cuando se está en Etapa 1 o Etapa 2 -->
            <div id="topNavActions" class="interactive hidden items-center gap-2.5">
                <button id="backBtn" onclick="stepBack()" class="px-3.5 py-1.5 rounded-full border border-[#EAB308]/45 bg-[#121110]/80 text-[#EAB308] text-[10px] font-medium tracking-[0.16em] uppercase hover:border-[#EAB308] hover:text-[#FAF6EE] transition-all">
                    ← Volver
                </button>
            </div>
        </div>
    </div>

    <!-- ==========================================================================
         ESQUINA SUPERIOR DERECHA (top: 44px, right: 52px)
         Solo visible en Etapa 2 (Desglose de Lugar) para filtrar por los 4 Pictogramas
         (Tránsito, Obras, Personas, Naturaleza) y los 3 Niveles (Bajo, Medio, Alto)
         ========================================================================== -->
    <div id="detailFiltersCorner" class="ui-corner top-8 right-8 sm:top-12 sm:right-14 hidden flex-col items-end gap-3.5 max-w-2xl">
        <!-- Fila 1: Los 4 Pictogramas Exactos + Total -->
        <div class="interactive flex flex-wrap justify-end gap-2">
            <button onclick="setWaveFilter('todas')" id="wf-todas" class="picto-btn active">
                <span>Total</span>
                <span class="opacity-75" id="wfCount-todas">24</span>
            </button>

            <!-- 1. Tránsito -->
            <button onclick="setWaveFilter('transito')" id="wf-transito" class="picto-btn">
                <svg class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 15h14l-1.5-5.5A2 2 0 0 0 15.6 8H8.4a2 2 0 0 0-1.9 1.5L5 15z"/>
                    <path d="M3 15h18v3a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1v-1H6v1a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-3z"/>
                    <circle cx="7.5" cy="12.5" r="0.8" fill="currentColor"/>
                    <circle cx="16.5" cy="12.5" r="0.8" fill="currentColor"/>
                </svg>
                <span>Tránsito</span>
                <span class="opacity-75" id="wfCount-transito">7</span>
            </button>

            <!-- 2. Obras -->
            <button onclick="setWaveFilter('obras')" id="wf-obras" class="picto-btn">
                <svg class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 4l6 6-2.5 2.5-6-6L14 4z"/>
                    <path d="M4 20l8.5-8.5"/>
                    <path d="M3 14h4M10 3v4M18 16l3 3"/>
                </svg>
                <span>Obras</span>
                <span class="opacity-75" id="wfCount-obras">3</span>
            </button>

            <!-- 3. Personas -->
            <button onclick="setWaveFilter('personas')" id="wf-personas" class="picto-btn">
                <svg class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="9" cy="7.5" r="3"/>
                    <path d="M3.5 19c0-3 2.5-5.2 5.5-5.2s5.5 2.2 5.5 5.2"/>
                    <circle cx="16.5" cy="8.5" r="2.2"/>
                    <path d="M15 14.2c2.4.3 4.5 2 4.5 4.6"/>
                </svg>
                <span>Personas</span>
                <span class="opacity-75" id="wfCount-personas">4</span>
            </button>

            <!-- 4. Naturaleza -->
            <button onclick="setWaveFilter('naturaleza')" id="wf-naturaleza" class="picto-btn">
                <svg class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2 15c2.5-2.8 5.5-2.8 8 0s5.5 2.8 8 0 3.5-2 4-1"/>
                    <path d="M12 3c-3.5 2.2-5 6-2 8.8 3-2.8 1.5-6.6-2-8.8z"/>
                </svg>
                <span>Naturaleza</span>
                <span class="opacity-75" id="wfCount-naturaleza">10</span>
            </button>
        </div>

        <!-- Fila 2: Únicamente los 3 Círculos de Intensidad (Bajo, Medio, Alto) -->
        <div class="interactive flex flex-wrap justify-end items-center gap-2">
            <span class="text-[9.5px] font-medium tracking-[0.18em] uppercase text-[#EAB308]/70 mr-1 poster-text">Intensidad:</span>
            <button onclick="setRingFilter(0)" id="rf-0" class="ring-pill active">Todos</button>
            <button onclick="setRingFilter(1)" id="rf-1" class="ring-pill">Bajo (<span id="rfCount-1">5</span>)</button>
            <button onclick="setRingFilter(2)" id="rf-2" class="ring-pill">Medio (<span id="rfCount-2">10</span>)</button>
            <button onclick="setRingFilter(3)" id="rf-3" class="ring-pill">Alto (<span id="rfCount-3">9</span>)</button>
        </div>

        <!-- Etiqueta cuando se aísla a 1 persona -->
        <button id="clearPersonBtn" onclick="clearIsolatedPerson()" class="interactive hidden px-3 py-1 rounded-full bg-[#EAB308] text-[#121110] text-[10px] font-semibold tracking-[0.12em] uppercase">
            Restaurar grupo ✕
        </button>
    </div>

    <!-- ==========================================================================
         ESQUINA INFERIOR IZQUIERDA (bottom: 48px, left: 52px)
         Diagramación idéntica al bloque izquierdo de "Sound Image Handel"
         ========================================================================== -->
    <div class="ui-corner bottom-9 left-8 sm:bottom-13 sm:left-14 max-w-md poster-text">

        <!-- Bloque principal de 5 líneas con la jerarquía del afiche de referencia -->
        <div class="space-y-0.5 text-[#EAB308] leading-[1.32] tracking-[-0.01em]">
            <div id="posterLine1" class="text-xl sm:text-[26px] font-semibold">
                Cartografía Cimática
            </div>
            <div id="posterLine2" class="text-lg sm:text-[22px] font-normal">
                Percepción en ondas de arena
            </div>
            <div id="posterLine3" class="text-base sm:text-[20px] font-light opacity-95">
                62 registros en tres territorios
            </div>
            <div id="posterLine4" class="text-base sm:text-[20px] font-light opacity-95">
                Sotomayor, Muelle Prat,
            </div>
            <div id="posterLine5" class="text-base sm:text-[20px] font-light opacity-95">
                Buenos Aires
            </div>
        </div>

        <!-- Leyenda compacta de los 4 Pictogramas (Tránsito, Obras, Personas, Naturaleza) + Pie de acción -->
        <div class="mt-6 space-y-3">
            <!-- Mini-fila de los 4 pictogramas siempre comprensibles -->
            <div class="flex flex-wrap items-center gap-x-4 gap-y-1.5 text-[10.5px] font-normal tracking-[0.06em] text-[#EAB308]/90">
                <span class="inline-flex items-center gap-1.5">
                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 15h14l-1.5-5.5A2 2 0 0 0 15.6 8H8.4a2 2 0 0 0-1.9 1.5L5 15z"/><path d="M3 15h18v3H3z"/></svg>
                    Tránsito
                </span>
                <span class="inline-flex items-center gap-1.5">
                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 4l6 6-2.5 2.5-6-6L14 4z"/><path d="M4 20l8.5-8.5"/></svg>
                    Obras
                </span>
                <span class="inline-flex items-center gap-1.5">
                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="7.5" r="3"/><path d="M3.5 19c0-3 2.5-5.2 5.5-5.2s5.5 2.2 5.5 5.2"/></svg>
                    Personas
                </span>
                <span class="inline-flex items-center gap-1.5">
                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 15c2.5-2.8 5.5-2.8 8 0s5.5 2.8 8 0"/><path d="M12 3c-3 2-4 5-2 7 2-2 1-5-2-7z"/></svg>
                    Naturaleza
                </span>
            </div>

            <!-- Pie de dos líneas al estilo "All concerts of the new season..." -->
            <div class="interactive pt-1">
                <button id="posterSmallCta" onclick="handlePrimaryAction()" class="text-left group focus:outline-none">
                    <div id="smallCaption1" class="text-[11px] sm:text-xs font-normal tracking-[0.02em] text-[#EAB308] cta-pulse group-hover:underline">
                        Click en la placa para ingresar al total →
                    </div>
                    <div id="smallCaption2" class="text-[11px] sm:text-xs font-light tracking-[0.02em] text-[#EAB308]/80">
                        4 pictogramas · 3 niveles de intensidad (Bajo · Medio · Alto)
                    </div>
                </button>
            </div>
        </div>
    </div>

    <!-- ==========================================================================
         ESQUINA INFERIOR DERECHA (bottom: 48px, right: 52px)
         Firma limpia en dos líneas idéntica a "Berliner Philharmoniker"
         ========================================================================== -->
    <div class="ui-corner bottom-9 right-8 sm:bottom-13 sm:right-14 flex flex-col items-end gap-4 poster-text">

        <!-- Navegación rápida y limpia entre lugares -->
        <nav id="QuickPlaceNav" class="interactive hidden sm:flex items-center gap-5 text-[11px] font-medium tracking-[0.08em] text-[#EAB308]/75">
            <button onclick="goToStage('overview')" id="nav-overview" class="hover:text-[#FAF6EE] transition-colors">
                Total (62)
            </button>
            <button onclick="enterPlaceDetail('sotomayor')" id="nav-sotomayor" class="hover:text-[#FAF6EE] transition-colors">
                Sotomayor (24)
            </button>
            <button onclick="enterPlaceDetail('muelle')" id="nav-muelle" class="hover:text-[#FAF6EE] transition-colors">
                Muelle Prat (20)
            </button>
            <button onclick="enterPlaceDetail('buenosaires')" id="nav-buenosaires" class="hover:text-[#FAF6EE] transition-colors">
                Buenos Aires (18)
            </button>
        </nav>

        <!-- Firma editorial de dos líneas en amarillo -->
        <div onclick="handlePrimaryAction()" class="interactive cursor-pointer text-right leading-[1.18] tracking-[-0.01em] text-[#EAB308]">
            <div id="brandRightLine1" class="text-lg sm:text-[23px] font-semibold">
                Visualización
            </div>
            <div id="brandRightLine2" class="text-lg sm:text-[23px] font-semibold">
                Datos en Arena
            </div>
        </div>
    </div>

    <script>
        /**
         * ============================================================================
         * 1. LOS 4 PICTOGRAMAS EXACTOS (TRÁNSITO, OBRAS, PERSONAS, NATURALEZA)
         *    Y LOS 3 NIVELES DE INTENSIDAD (BAJO, MEDIO, ALTO)
         * ============================================================================
         */
        const WAVE_TYPES = {
            transito: {
                key: 'transito',
                pictogramName: 'Tránsito',
                waveQuality: 'Onda de Tránsito',
                lobes: 6,          // Estrella hexagonal de flujo vehicular continuo
                kRadial: 3.12,
                lobeAmp: 0.52,
                innerRing: 0.16,
                emblemSides: 6,
                vibFreq: 1.35
            },
            obras: {
                key: 'obras',
                pictogramName: 'Obras',
                waveQuality: 'Onda de Obras',
                lobes: 8,          // Octogonal de pulsos mecánicos y percusión urbana
                kRadial: 2.85,
                lobeAmp: 0.56,
                innerRing: 0.14,
                emblemSides: 8,
                vibFreq: 1.65
            },
            personas: {
                key: 'personas',
                pictogramName: 'Personas',
                waveQuality: 'Onda de Personas',
                lobes: 2,          // Bipolar abierta de voces y pasos humanos
                kRadial: 1.76,
                lobeAmp: 0.48,
                innerRing: 0.20,
                emblemSides: 5,
                vibFreq: 0.95
            },
            naturaleza: {
                key: 'naturaleza',
                pictogramName: 'Naturaleza',
                waveQuality: 'Onda de Naturaleza',
                lobes: 4,          // Cuadrilobular armónica como el afiche de Handel
                kRadial: 2.22,
                lobeAmp: 0.46,
                innerRing: 0.24,
                emblemSides: 4,
                vibFreq: 0.80
            }
        };

        // ÚNICAMENTE 3 CÍRCULOS DE INTENSIDAD: BAJO, MEDIO Y ALTO
        const INTENSITY_RINGS = [
            { level: 1, short: 'BAJO',  name: 'Bajo',  label: 'Intensidad Baja',  radiusNorm: 0.31 },
            { level: 2, short: 'MEDIO', name: 'Medio', label: 'Intensidad Media', radiusNorm: 0.58 },
            { level: 3, short: 'ALTO',  name: 'Alto',  label: 'Intensidad Alta',  radiusNorm: 0.85 }
        ];

        // DATOS FIJOS CERRADOS (Sotomayor = 24, Muelle Prat = 20, Buenos Aires = 18 -> Total = 62)
        // Cada registro pertenece a uno de los 3 círculos (1: Bajo, 2: Medio, 3: Alto)
        // y a uno de los 4 pictogramas ('transito', 'obras', 'personas', 'naturaleza').
        const PLACES_DATA = {
            sotomayor: {
                id: 'sotomayor',
                name: 'Plaza Sotomayor',
                subtitle: 'Confluencia urbana y eco patrimonial',
                layoutRatio: { x: 0.28, y: 0.37, sizeScale: 1.18 },
                people: [
                    // Nivel 1: Bajo (5 personas)
                    { id: 'S-01', ring: 1, wave: 'naturaleza', angle: 0.45, freqMod: 1.00, note: 'Brisa húmeda contenida en el centro.' },
                    { id: 'S-02', ring: 1, wave: 'personas',   angle: 1.75, freqMod: 0.97, note: 'Pasos tranquilos sobre la explanada.' },
                    { id: 'S-03', ring: 1, wave: 'naturaleza', angle: 3.05, freqMod: 1.02, note: 'Aire costero envolvente entre fachadas.' },
                    { id: 'S-04', ring: 1, wave: 'personas',   angle: 4.35, freqMod: 0.98, note: 'Conversación suave hacia el monumento.' },
                    { id: 'S-05', ring: 1, wave: 'naturaleza', angle: 5.55, freqMod: 1.03, note: 'Eco lejano de gaviotas y viento.' },

                    // Nivel 2: Medio (10 personas)
                    { id: 'S-06', ring: 2, wave: 'naturaleza', angle: 0.25, freqMod: 1.00, note: 'Viento que rebota en las cuatro esquinas.' },
                    { id: 'S-07', ring: 2, wave: 'transito',   angle: 0.88, freqMod: 1.06, note: 'Flujo constante por calle Serrano.' },
                    { id: 'S-08', ring: 2, wave: 'naturaleza', angle: 1.50, freqMod: 0.97, note: 'Resonancia natural como anfiteatro.' },
                    { id: 'S-09', ring: 2, wave: 'personas',   angle: 2.12, freqMod: 1.01, note: 'Murmullo peatonal hacia el puerto.' },
                    { id: 'S-10', ring: 2, wave: 'obras',      angle: 2.75, freqMod: 1.09, note: 'Reparación de adoquines en el borde.' },
                    { id: 'S-11', ring: 2, wave: 'naturaleza', angle: 3.38, freqMod: 1.03, note: 'Corriente marina que abraza la plaza.' },
                    { id: 'S-12', ring: 2, wave: 'transito',   angle: 4.00, freqMod: 1.08, note: 'Pulso de buses en el eje arterial.' },
                    { id: 'S-13', ring: 2, wave: 'naturaleza', angle: 4.62, freqMod: 1.04, note: 'Envolvimiento acústico desde los muros.' },
                    { id: 'S-14', ring: 2, wave: 'personas',   angle: 5.25, freqMod: 0.96, note: 'Grupos cruzando hacia la estación.' },
                    { id: 'S-15', ring: 2, wave: 'naturaleza', angle: 5.88, freqMod: 1.02, note: 'Cúpula de viento por simetría urbana.' },

                    // Nivel 3: Alto (9 personas)
                    { id: 'S-16', ring: 3, wave: 'transito',   angle: 0.35, freqMod: 1.11, note: 'Vibración intensa de tránsito vehicular.' },
                    { id: 'S-17', ring: 3, wave: 'obras',      angle: 1.05, freqMod: 1.15, note: 'Maquinaria de mantención en fachada.' },
                    { id: 'S-18', ring: 3, wave: 'transito',   angle: 1.75, freqMod: 1.09, note: 'Motores acelerando en el perímetro sur.' },
                    { id: 'S-19', ring: 3, wave: 'naturaleza', angle: 2.45, freqMod: 1.05, note: 'Ráfaga costera encajonada con fuerza.' },
                    { id: 'S-20', ring: 3, wave: 'transito',   angle: 3.15, freqMod: 1.13, note: 'Tránsito pesado reflejado en piedra.' },
                    { id: 'S-21', ring: 3, wave: 'obras',      angle: 3.85, freqMod: 1.16, note: 'Golpe metálico de obra portuaria.' },
                    { id: 'S-22', ring: 3, wave: 'transito',   angle: 4.55, freqMod: 1.12, note: 'Saturación de motores en acera oriente.' },
                    { id: 'S-23', ring: 3, wave: 'naturaleza', angle: 5.25, freqMod: 1.06, note: 'Resonancia envolvente de gran amplitud.' },
                    { id: 'S-24', ring: 3, wave: 'transito',   angle: 5.95, freqMod: 1.10, note: 'Pico vehicular en el borde arterial.' }
                ]
            },

            muelle: {
                id: 'muelle',

        /**
         * ============================================================================
         * 2. MOTOR DE ARENA DE CUARZO CON VIBRACIÓN ACÚSTICA EN EL LUGAR (28,000 GRANOS)
         * ============================================================================
         */
        const PARTICLE_COUNT = 28000;
        let canvas, ctx;
        let width = window.innerWidth;
        let height = window.innerHeight;

        const px = new Float32Array(PARTICLE_COUNT);
        const py = new Float32Array(PARTICLE_COUNT);
        const vx = new Float32Array(PARTICLE_COUNT);
        const vy = new Float32Array(PARTICLE_COUNT);
        const pSize = new Float32Array(PARTICLE_COUNT);
        const pPhase = new Float32Array(PARTICLE_COUNT);
        const pZoneAssign = new Uint8Array(PARTICLE_COUNT); // 0: Sotomayor, 1: Muelle, 2: BsAs

        const SAND_COLORS = [
            'rgba(252, 248, 240, 0.94)',
            'rgba(235, 228, 214, 0.88)',
            'rgba(216, 207, 188, 0.82)',
            'rgba(182, 172, 154, 0.74)',
            'rgba(255, 254, 250, 0.97)'
        ];

        // Etapas: 'intro' -> 'overview' -> 'detail'
        let currentStage = 'intro';
        let activePlaceKey = 'sotomayor';
        let activeWaveFilter = 'todas';
        let activeRingFilter = 0; // 0: Todos, 1: Bajo, 2: Medio, 3: Alto
        let isolatedPerson = null;
        let hoveredItem = null;
        let settleEnergy = 1.0;

        // Estado de la vibración acústica continua en el lugar
        let vibrationActive = true;
        let simTime = 0;

        const placeHarmonicSummary = {};

        window.onload = function () {
            canvas = document.getElementById('sandCanvas');
            ctx = canvas.getContext('2d');

            precomputeFixedSummaries();
            handleResize();

            window.addEventListener('resize', () => {
                handleResize();
                distributeParticlesForCurrentStage();
                settleImmediately();
            });

            initSandGrains();
            setupCanvasInteractions();
            settleImmediately();

            updatePosterTypography();
            updateHarmonicEmblem();
            requestAnimationFrame(renderLoop);
        };

        function precomputeFixedSummaries() {
            Object.keys(PLACES_DATA).forEach(key => {
                const people = PLACES_DATA[key].people;
                const total = people.length;
                const waveCounts = { transito: 0, obras: 0, personas: 0, naturaleza: 0 };
                people.forEach(p => waveCounts[p.wave]++);

                const weights = {
                    transito:   waveCounts.transito / total,
                    obras:      waveCounts.obras / total,
                    personas:   waveCounts.personas / total,
                    naturaleza: waveCounts.naturaleza / total
                };

                let dominantWave = 'naturaleza';
                let maxC = -1;
                Object.keys(waveCounts).forEach(w => {
                    if (waveCounts[w] > maxC) {
                        maxC = waveCounts[w];
                        dominantWave = w;
                    }
                });

                placeHarmonicSummary[key] = { total, waveCounts, weights, dominantWave };
            });
        }

        function handleResize() {
            width = window.innerWidth;
            height = window.innerHeight;
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
        }

        function initSandGrains() {
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                pSize[i] = (i % 5 === 0) ? 1.68 : 1.24;
                pPhase[i] = (i * 0.6180339887) % (Math.PI * 2);
                const mod = i % 62;
                if (mod < 24) pZoneAssign[i] = 0;
                else if (mod < 44) pZoneAssign[i] = 1;
                else pZoneAssign[i] = 2;
            }
            distributeParticlesForCurrentStage();
        }

        function toggleVibrationMode() {
            vibrationActive = !vibrationActive;
            const dot = document.getElementById('vibIndicatorDot');
            const label = document.getElementById('vibStatusLabel');
            if (vibrationActive) {
                dot.classList.add('vib-dot');
                dot.style.opacity = '1';
                label.textContent = 'Vibración en el Lugar · Activa';
            } else {
                dot.classList.remove('vib-dot');
                dot.style.opacity = '0.35';
                label.textContent = 'Vibración en el Lugar · Pausada';
            }
        }

        /**
         * GEOMETRÍA DE LAS 3 ETAPAS
         */
        function getOverviewConstellationGeometry() {
            const isMobile = width < 768;
            const minDim = Math.min(width, height);
            const baseR = isMobile ? minDim * 0.165 : minDim * 0.145;

            const hubX = width * 0.49;
            const hubY = height * 0.47;

            if (isMobile) {
                return {
                    hub: { cx: width * 0.50, cy: height * 0.46, radius: baseR * 0.36 },
                    zones: [
                        { key: 'sotomayor',   cx: width * 0.30, cy: height * 0.29, radius: baseR * 1.16 },
                        { key: 'muelle',      cx: width * 0.72, cy: height * 0.43, radius: baseR * 1.00 },
                        { key: 'buenosaires', cx: width * 0.43, cy: height * 0.65, radius: baseR * 0.88 }
                    ]
                };
            }

            return {
                hub: { cx: hubX, cy: hubY, radius: baseR * 0.38 },
                zones: [
                    // Sotomayor (N=24): Más grande, elevado a la izquierda
                    { key: 'sotomayor',   cx: width * 0.29, cy: height * 0.34, radius: baseR * 1.22 },
                    // Muelle Prat (N=20): Mediano, desplazado a la derecha a media altura
                    { key: 'muelle',      cx: width * 0.71, cy: height * 0.41, radius: baseR * 1.04 },
                    // Buenos Aires (N=18): Más compacto, en la parte inferior central
                    { key: 'buenosaires', cx: width * 0.48, cy: height * 0.71, radius: baseR * 0.92 }
                ]
            };
        }

        function getSinglePlateGeometry(isIntro = false) {
            const cx = width * 0.50;
            const cy = height * 0.49;
            const scale = isIntro ? 0.44 : (width < 640 ? 0.35 : 0.34);
            const radius = Math.min(width, height) * scale;
            return { cx, cy, radius };
        }

        function distributeParticlesForCurrentStage() {
            if (currentStage === 'overview') {
                const { zones } = getOverviewConstellationGeometry();
                for (let i = 0; i < PARTICLE_COUNT; i++) {
                    const z = zones[pZoneAssign[i]];
                    const a = (i * 1.6180339) % (Math.PI * 2);
                    const r = Math.sqrt(((i * 7919) % 10000) / 10000) * z.radius * 1.14;
                    px[i] = z.cx + Math.cos(a) * r;
                    py[i] = z.cy + Math.sin(a) * r;
                    vx[i] = 0;
                    vy[i] = 0;
                }
            } else {
                const plate = getSinglePlateGeometry(currentStage === 'intro');
                const spread = currentStage === 'intro' ? 1.45 : 1.12;
                for (let i = 0; i < PARTICLE_COUNT; i++) {
                    const a = (i * 1.6180339) % (Math.PI * 2);
                    const r = Math.sqrt(((i * 7919) % 10000) / 10000) * plate.radius * spread;
                    px[i] = plate.cx + Math.cos(a) * r;
                    py[i] = plate.cy + Math.sin(a) * r;
                    vx[i] = 0;
                    vy[i] = 0;
                }
            }
        }

        /**
         * ============================================================================
         * 3. ECUACIONES DE ONDA ESTACIONARIA (CHLADNI) CON PULSO DE VIBRACIÓN VIVA
         * ============================================================================
         */
        function evaluateWaveMode(waveTypeObj, rNorm, theta, freqMod = 1.0, breath = 0.0) {
            const env = Math.min(1.0, Math.max(0.0, (rNorm - waveTypeObj.innerRing) * 1.48));
            const lobeAmpLive = waveTypeObj.lobeAmp * (1.0 + breath * 0.045);
            const angular = lobeAmpLive * env * Math.cos(waveTypeObj.lobes * theta);
            return Math.sin((waveTypeObj.kRadial * freqMod + breath * 0.03) * Math.PI * rNorm + angular * Math.PI);
        }

        // Ecuación de la Portada (Etapa 0): Figura cuadrilobular + anillo interior idéntica al póster Handel
        function evaluateIntroPosterWave(x, y, cx, cy, radius, breath = 0.0) {
            const nx = (x - cx) / radius;
            const ny = (y - cy) / radius;
            const r = Math.hypot(nx, ny);
            const theta = Math.atan2(ny, nx);

            if (r < 0.055) return 1.5;

            const env = Math.min(1.0, Math.max(0.0, (r - 0.25) * 1.42));
            const angular = (0.45 + breath * 0.018) * env * Math.cos(4 * theta);
            return Math.sin((2.22 + breath * 0.02) * Math.PI * r + angular * Math.PI);
        }

        function evaluateZoneTotalWave(placeKey, x, y, cx, cy, radius, breath = 0.0) {
            const nx = (x - cx) / radius;
            const ny = (y - cy) / radius;
            const r = Math.hypot(nx, ny);
            const theta = Math.atan2(ny, nx);

            if (r < 0.08) return 1.4;
            if (r > 1.04) return (r - 1.04) * 3.0;

            const w = placeHarmonicSummary[placeKey].weights;
            let val = 0;
            val += w.transito   * evaluateWaveMode(WAVE_TYPES.transito, r, theta, 1.0, breath);
            val += w.obras      * evaluateWaveMode(WAVE_TYPES.obras, r, theta, 1.0, breath);
            val += w.personas   * evaluateWaveMode(WAVE_TYPES.personas, r, theta, 1.0, breath);
            val += w.naturaleza * evaluateWaveMode(WAVE_TYPES.naturaleza, r, theta, 1.0, breath);

            const outerBoundary = Math.sin(Math.PI * (r / 1.02));
            return val * 0.85 + outerBoundary * 0.15;
        }

        function evaluateDetailPlateWave(x, y, cx, cy, radius, breath = 0.0) {
            const nx = (x - cx) / radius;
            const ny = (y - cy) / radius;
            const r = Math.hypot(nx, ny);
            const theta = Math.atan2(ny, nx);

            if (r < 0.068) return 1.5;
            if (r > 1.08) return (r - 1.08) * 3.2;

            if (isolatedPerson) {
                const wObj = WAVE_TYPES[isolatedPerson.wave];
                const ringObj = INTENSITY_RINGS[isolatedPerson.ring - 1];
                const personWave = evaluateWaveMode(wObj, r, theta - isolatedPerson.angle, isolatedPerson.freqMod, breath);
                const ringPull = Math.sin(((r - ringObj.radiusNorm) / 0.22) * Math.PI);
                return personWave * 0.65 + ringPull * 0.35;
            }

            const people = getFilteredPeopleInActivePlace();
            if (people.length === 0) return Math.sin(r * Math.PI * 3);

            const counts = { transito: 0, obras: 0, personas: 0, naturaleza: 0 };
            people.forEach(p => counts[p.wave]++);
            const total = people.length;

            let waveSum = 0;
            if (counts.transito > 0)   waveSum += (counts.transito / total)   * evaluateWaveMode(WAVE_TYPES.transito, r, theta, 1.0, breath);
            if (counts.obras > 0)      waveSum += (counts.obras / total)      * evaluateWaveMode(WAVE_TYPES.obras, r, theta, 1.0, breath);
            if (counts.personas > 0)   waveSum += (counts.personas / total)   * evaluateWaveMode(WAVE_TYPES.personas, r, theta, 1.0, breath);
            if (counts.naturaleza > 0) waveSum += (counts.naturaleza / total) * evaluateWaveMode(WAVE_TYPES.naturaleza, r, theta, 1.0, breath);

            // Si se filtra por uno de los 3 niveles (Bajo, Medio, Alto), concentrar la arena en torno a ese anillo
            if (activeRingFilter > 0) {
                const targetR = INTENSITY_RINGS[activeRingFilter - 1].radiusNorm;
                const distFromRing = Math.abs(r - targetR);
                if (distFromRing > 0.14) {
                    return (distFromRing - 0.06) * 2.3;
                }
            }
            return waveSum;
        }

        /**
         * PASO DE FÍSICA Y MICRO-VIBRACIÓN ACÚSTICA EN EL LUGAR:
         * Nunca congela los granos a cero si `vibrationActive` está encendido.
         * Mantiene la figura Chladni perfectamente definida mientras cada grano vibra en su lugar.
         */
        function stepSandSettlement(energyFactor, breath = 0.0) {
            if (energyFactor <= 0.001) return;
            const eps = 2.2;

            if (currentStage === 'intro') {
                const plate = getSinglePlateGeometry(true);
                for (let i = 0; i < PARTICLE_COUNT; i++) {
                    const isDust = (i % 9 === 0);
                    let x = px[i], y = py[i];

                    const w0 = Math.abs(evaluateIntroPosterWave(x, y, plate.cx, plate.cy, plate.radius, breath));
                    const wx = Math.abs(evaluateIntroPosterWave(x + eps, y, plate.cx, plate.cy, plate.radius, breath)) - w0;
                    const wy = Math.abs(evaluateIntroPosterWave(x, y + eps, plate.cx, plate.cy, plate.radius, breath)) - w0;

                    const pull = isDust ? 0.55 : 4.8;
                    vx[i] -= wx * pull;
                    vy[i] -= wy * pull;

                    // Vibración acústica en el lugar: los granos en la cresta nodal tiemblan sutilmente,
                    // y los granos en zonas oscuras (w0 alto) rebotan más vivo sobre el metal.
                    const harmonicTremor = Math.sin(simTime * 16.0 + pPhase[i]) * 0.42 * energyFactor;
                    const antinodeBounce = (w0 * 3.6 + 0.34) * energyFactor * (isDust ? 1.85 : 0.92);

                    vx[i] += (Math.random() - 0.5) * antinodeBounce + Math.cos(pPhase[i] + simTime * 9.0) * harmonicTremor;
                    vy[i] += (Math.random() - 0.5) * antinodeBounce + Math.sin(pPhase[i] + simTime * 9.0) * harmonicTremor;

                    vx[i] *= 0.62;
                    vy[i] *= 0.62;
                    px[i] += vx[i];
                    py[i] += vy[i];
                }
            } else if (currentStage === 'overview') {
                const { zones } = getOverviewConstellationGeometry();
                for (let i = 0; i < PARTICLE_COUNT; i++) {
                    const isDust = (i % 13 === 0);
                    const z = zones[pZoneAssign[i]];
                    let x = px[i], y = py[i];

                    const w0 = Math.abs(evaluateZoneTotalWave(z.key, x, y, z.cx, z.cy, z.radius, breath));
                    const wx = Math.abs(evaluateZoneTotalWave(z.key, x + eps, y, z.cx, z.cy, z.radius, breath)) - w0;
                    const wy = Math.abs(evaluateZoneTotalWave(z.key, x, y + eps, z.cx, z.cy, z.radius, breath)) - w0;

                    const pull = isDust ? 0.58 : 4.5;
                    vx[i] -= wx * pull;
                    vy[i] -= wy * pull;

                    const harmonicTremor = Math.sin(simTime * 15.0 + pPhase[i]) * 0.38 * energyFactor;
                    const antinodeBounce = (w0 * 3.4 + 0.30) * energyFactor * (isDust ? 1.65 : 0.88);

                    vx[i] += (Math.random() - 0.5) * antinodeBounce + Math.cos(pPhase[i] + simTime * 8.5) * harmonicTremor;
                    vy[i] += (Math.random() - 0.5) * antinodeBounce + Math.sin(pPhase[i] + simTime * 8.5) * harmonicTremor;

                    vx[i] *= 0.63;
                    vy[i] *= 0.63;
                    px[i] += vx[i];
                    py[i] += vy[i];
                }
            } else {
                const plate = getSinglePlateGeometry(false);
                for (let i = 0; i < PARTICLE_COUNT; i++) {
                    const isDust = (i % 14 === 0);
                    let x = px[i], y = py[i];

                    const w0 = Math.abs(evaluateDetailPlateWave(x, y, plate.cx, plate.cy, plate.radius, breath));
                    const wx = Math.abs(evaluateDetailPlateWave(x + eps, y, plate.cx, plate.cy, plate.radius, breath)) - w0;
                    const wy = Math.abs(evaluateDetailPlateWave(x, y + eps, plate.cx, plate.cy, plate.radius, breath)) - w0;

                    const pull = isDust ? 0.58 : 4.7;
                    vx[i] -= wx * pull;
                    vy[i] -= wy * pull;

                    const harmonicTremor = Math.sin(simTime * 17.0 + pPhase[i]) * 0.44 * energyFactor;
                    const antinodeBounce = (w0 * 3.8 + 0.32) * energyFactor * (isDust ? 1.75 : 0.90);

                    vx[i] += (Math.random() - 0.5) * antinodeBounce + Math.cos(pPhase[i] + simTime * 10.0) * harmonicTremor;
                    vy[i] += (Math.random() - 0.5) * antinodeBounce + Math.sin(pPhase[i] + simTime * 10.0) * harmonicTremor;

                    vx[i] *= 0.62;
                    vy[i] *= 0.62;
                    px[i] += vx[i];
                    py[i] += vy[i];
                }
            }
        }

        function settleImmediately() {
            for (let i = 0; i < 38; i++) {
                stepSandSettlement(0.75 * (1 - i / 42), 0.0);
            }
            // Se mantiene en un nivel base de vibración estacionaria en lugar de caer a 0
            settleEnergy = 0.24;
        }

        function triggerGentleReorganization() {
            settleEnergy = 0.95;
            for (let s = 0; s < 14; s++) {
                stepSandSettlement(settleEnergy, 0.0);
                settleEnergy *= 0.91;
            }
        }

        /**
         * ============================================================================
         * 4. RENDERIZADO VISUAL EN CANVAS CON VIBRACIÓN EN TIEMPO REAL
         * ============================================================================
         */
        function renderLoop() {
            simTime += 0.035;

            // Energía mínima continua de vibración acústica en el lugar (0.22 cuando está activa)
            const steadyFloor = vibrationActive ? 0.22 : 0.0;
            if (settleEnergy > steadyFloor) {
                settleEnergy = Math.max(steadyFloor, settleEnergy * 0.92);
            } else {
                settleEnergy = steadyFloor;
            }

            const breath = vibrationActive ? Math.sin(simTime * 1.8) : 0.0;
            if (settleEnergy > 0.001) {
                stepSandSettlement(settleEnergy, breath);
            }

            ctx.fillStyle = '#121110';
            ctx.fillRect(0, 0, width, height);

            // Dibujar los 28,000 granos de arena de cuarzo
            for (let c = 0; c < SAND_COLORS.length; c++) {
                ctx.fillStyle = SAND_COLORS[c];
                ctx.beginPath();
                for (let i = c; i < PARTICLE_COUNT; i += SAND_COLORS.length) {
                    const s = pSize[i];
                    ctx.rect(px[i], py[i], s, s);
                }
                ctx.fill();
            }

            // Micro-vibración visual del perno central cuando la placa está excitada
            const boltJitterX = vibrationActive ? Math.cos(simTime * 24) * 0.35 : 0;
            const boltJitterY = vibrationActive ? Math.sin(simTime * 28) * 0.35 : 0;

            if (currentStage === 'intro') {
                const plate = getSinglePlateGeometry(true);
                drawHexBolt(plate.cx + boltJitterX, plate.cy + boltJitterY, 11.5);
            } else if (currentStage === 'overview') {
                renderOverviewConstellation(boltJitterX, boltJitterY);
            } else {
                renderDetailOverlay(boltJitterX, boltJitterY);
            }

            requestAnimationFrame(renderLoop);
        }

        // Etapa 1: Los 3 lugares en diversas alturas y tamaños orbitando en torno al Total (N=62)
        function renderOverviewConstellation(boltJitterX, boltJitterY) {
            const { hub, zones } = getOverviewConstellationGeometry();

            ctx.save();

            // 1. Filamentos capilares desde cada lugar hacia el núcleo del Total (N=62)
            zones.forEach(z => {
                const isHovered = hoveredItem && hoveredItem.type === 'zone' && hoveredItem.key === z.key;
                ctx.beginPath();
                ctx.setLineDash([3, 7]);
                ctx.strokeStyle = isHovered ? 'rgba(234, 179, 8, 0.75)' : 'rgba(234, 179, 8, 0.24)';
                ctx.lineWidth = isHovered ? 1.4 : 0.9;
                ctx.moveTo(hub.cx, hub.cy);
                ctx.lineTo(z.cx, z.cy);
                ctx.stroke();
            });
            ctx.setLineDash([]);

            // 2. Núcleo articulador del Total (N = 62)
            const hubPulse = vibrationActive ? Math.sin(simTime * 3.2) * 1.2 : 0;
            ctx.beginPath();
            ctx.arc(hub.cx, hub.cy, 28 + hubPulse, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(18, 17, 16, 0.88)';
            ctx.fill();
            ctx.strokeStyle = 'rgba(234, 179, 8, 0.55)';
            ctx.lineWidth = 1.2;
            ctx.stroke();

            ctx.textAlign = 'center';
            ctx.fillStyle = '#EAB308';
            ctx.font = '600 11px Montserrat';
            ctx.fillText('TOTAL', hub.cx, hub.cy - 3);
            ctx.font = '400 10px Montserrat';
            ctx.fillStyle = 'rgba(250, 246, 238, 0.85)';
            ctx.fillText('N = 62', hub.cx, hub.cy + 11);

            // 3. Dibujar cada una de las 3 placas en su altura y tamaño proporcional
            zones.forEach((z, idx) => {
                const place = PLACES_DATA[z.key];
                const summary = placeHarmonicSummary[z.key];
                const isHovered = hoveredItem && hoveredItem.type === 'zone' && hoveredItem.key === z.key;
                const ringVib = vibrationActive ? Math.sin(simTime * 4.5 + idx * 1.7) * 0.9 : 0;

                ctx.beginPath();
                ctx.arc(z.cx, z.cy, z.radius * 1.02 + ringVib, 0, Math.PI * 2);
                ctx.strokeStyle = isHovered ? '#EAB308' : 'rgba(234, 179, 8, 0.30)';
                ctx.lineWidth = isHovered ? 1.9 : 1.0;
                ctx.stroke();

                drawHexBolt(z.cx + boltJitterX, z.cy + boltJitterY, 8.5 * (z.radius / 115));

                const labelY = z.cy - z.radius - 18;
                ctx.textAlign = 'center';
                ctx.fillStyle = '#EAB308';
                ctx.font = isHovered ? '600 13px Montserrat' : '500 12px Montserrat';
                ctx.fillText(`${place.name} (${summary.total})`, z.cx, labelY);

                ctx.fillStyle = isHovered ? '#FAF6EE' : 'rgba(234, 179, 8, 0.75)';
                ctx.font = '300 10.5px Montserrat';
                ctx.fillText(
                    isHovered ? 'Click para abrir Bajo · Medio · Alto →' : `Predomina: ${WAVE_TYPES[summary.dominantWave].pictogramName}`,
                    z.cx,
                    z.cy + z.radius + 20
                );
            });

            ctx.restore();
        }

        // Etapa 2: Placa del lugar con sus 3 círculos de intensidad (Bajo, Medio, Alto) y las ondas vivas
        function renderDetailOverlay(boltJitterX, boltJitterY) {
            const plate = getSinglePlateGeometry(false);
            const place = PLACES_DATA[activePlaceKey];
            const filteredPeople = getFilteredPeopleInActivePlace();
            const filteredIds = new Set(filteredPeople.map(p => p.id));

            ctx.save();

            // 1. Los 3 Círculos concéntricos del instrumento (BAJO, MEDIO, ALTO)
            INTENSITY_RINGS.forEach(ring => {
                const rPx = plate.radius * ring.radiusNorm;
                const isSelected = (activeRingFilter === ring.level);
                const isHovered = (hoveredItem && hoveredItem.type === 'ring' && hoveredItem.level === ring.level);

                ctx.beginPath();
                ctx.arc(plate.cx, plate.cy, rPx, 0, Math.PI * 2);

                if (isSelected || isHovered) {
                    ctx.strokeStyle = '#EAB308';
                    ctx.lineWidth = 1.7;
                    ctx.setLineDash([]);
                } else {
                    ctx.strokeStyle = activeRingFilter === 0 ? 'rgba(234, 179, 8, 0.28)' : 'rgba(234, 179, 8, 0.10)';
                    ctx.lineWidth = 0.95;
                    ctx.setLineDash([4, 7]);
                }
                ctx.stroke();
                ctx.setLineDash([]);

                // Etiqueta clara BAJO / MEDIO / ALTO en el eje superior de cada círculo
                ctx.textAlign = 'center';
                ctx.font = (isSelected || isHovered) ? '600 10px Montserrat' : '500 9.5px Montserrat';
                ctx.fillStyle = (isSelected || isHovered) ? '#FDE047' : 'rgba(234, 179, 8, 0.65)';
                ctx.fillText(ring.short, plate.cx, plate.cy - rPx - 6);
            });

            // 2. Nodos de personas y su onda estacionaria individual vibrando en tiempo real
            place.people.forEach(person => {
                const isIncluded = filteredIds.has(person.id) && (!isolatedPerson || isolatedPerson.id === person.id);
                const isHighlighted = (hoveredItem && hoveredItem.type === 'person' && hoveredItem.person.id === person.id) ||
                                      (isolatedPerson && isolatedPerson.id === person.id);

                const ringInfo = INTENSITY_RINGS[person.ring - 1];
                const waveInfo = WAVE_TYPES[person.wave];
                const baseR = plate.radius * ringInfo.radiusNorm;

                // Fase de vibración viva para la onda de cada persona
                const livePhase = vibrationActive ? simTime * 5.2 * waveInfo.vibFreq : 0;
                const nodeRadialTremor = vibrationActive
                    ? Math.sin(livePhase + person.angle * 3.0) * (1.2 + person.ring * 0.55)
                    : 0;

                const pxNode = plate.cx + Math.cos(person.angle) * (baseR + nodeRadialTremor);
                const pyNode = plate.cy + Math.sin(person.angle) * (baseR + nodeRadialTremor);

                if (isIncluded) {
                    ctx.beginPath();
                    const arcSpan = isHighlighted ? Math.PI * 2 : 0.56;
                    const steps = isHighlighted ? 160 : 38;
                    const waveAmpPx = (6 + person.ring * 3.8) * (isHighlighted ? 1.45 : 0.85);

                    for (let s = 0; s <= steps; s++) {
                        const a = (person.angle - arcSpan / 2) + (s / steps) * arcSpan;
                        const env = isHighlighted ? 1.0 : Math.sin((s / steps) * Math.PI);
                        const osc = Math.sin((a - person.angle) * waveInfo.lobes * 2.4 * person.freqMod + livePhase);
                        const rOsc = baseR + osc * waveAmpPx * env;
                        const wx = plate.cx + Math.cos(a) * rOsc;
                        const wy = plate.cy + Math.sin(a) * rOsc;
                        if (s === 0) ctx.moveTo(wx, wy);
                        else ctx.lineTo(wx, wy);
                    }
                    ctx.strokeStyle = isHighlighted ? '#FDE047' : 'rgba(234, 179, 8, 0.52)';
                    ctx.lineWidth = isHighlighted ? 1.95 : 1.15;
                    ctx.stroke();
                }

                // Punto dorado de la persona
                const rDot = isHighlighted ? 6.2 : (isIncluded ? 4.0 : 1.8);
                ctx.beginPath();
                ctx.arc(pxNode, pyNode, rDot, 0, Math.PI * 2);
                ctx.fillStyle = isHighlighted ? '#FAF6EE' : (isIncluded ? '#EAB308' : 'rgba(234, 179, 8, 0.18)');
                ctx.fill();
            });

            // 3. Perno metálico central con micro-vibración
            drawHexBolt(plate.cx + boltJitterX, plate.cy + boltJitterY, 10.5);

            ctx.restore();
        }

        // Etapa 2: Placa del lugar con sus 5 círculos de intensidad y las ondas de cada persona
        function renderDetailOverlay() {
            const plate = getSinglePlateGeometry(false);
            const place = PLACES_DATA[activePlaceKey];
            const filteredPeople = getFilteredPeopleInActivePlace();
            const filteredIds = new Set(filteredPeople.map(p => p.id));

            ctx.save();

            // 1. Los 5 Círculos concéntricos del instrumento
            INTENSITY_RINGS.forEach(ring => {

                ctx.beginPath();

                if (isSelected || isHovered) {

                    ctx.setLineDash([]);
                } else {
                    ctx.strokeStyle = activeRingFilter === 0 ? 'rgba(234, 179, 8, 0.24)' : 'rgba(234, 179, 8, 0.09)';
                    ctx.lineWidth = 0.85;
                    ctx.setLineDash([3, 6]);
                }
                ctx.stroke();
                ctx.setLineDash([]);

                // Numeración mínima C1..C5 en el eje vertical superior
                ctx.textAlign = 'center';
                ctx.font = (isSelected || isHovered) ? '600 9.5px Montserrat' : '400 9px Montserrat';
                ctx.fillStyle = (isSelected || isHovered) ? '#FDE047' : 'rgba(234, 179, 8, 0.55)';
                ctx.fillText(`C${ring.level}`, plate.cx, plate.cy - rPx - 5);
            });

            // 2. Nodos de personas y su onda estacionaria individual
            place.people.forEach(person => {
                const isIncluded = filteredIds.has(person.id) && (!isolatedPerson || isolatedPerson.id === person.id);
                const isHighlighted = (hoveredItem && hoveredItem.type === 'person' && hoveredItem.person.id === person.id) ||
                                      (isolatedPerson && isolatedPerson.id === person.id);

                const ringInfo = INTENSITY_RINGS[person.ring - 1];
                const waveInfo = WAVE_TYPES[person.wave];
                const baseR = plate.radius * ringInfo.radiusNorm;
                const pxNode = plate.cx + Math.cos(person.angle) * baseR;
                const pyNode = plate.cy + Math.sin(person.angle) * baseR;

                if (isIncluded) {
                    ctx.beginPath();
                    const arcSpan = isHighlighted ? Math.PI * 2 : 0.52;
                    const steps = isHighlighted ? 160 : 34;
                    const waveAmpPx = (5 + person.ring * 2.8) * (isHighlighted ? 1.4 : 0.8);

                    for (let s = 0; s <= steps; s++) {
                        const a = (person.angle - arcSpan / 2) + (s / steps) * arcSpan;
                        const env = isHighlighted ? 1.0 : Math.sin((s / steps) * Math.PI);
                        const osc = Math.sin((a - person.angle) * waveInfo.lobes * 2.4 * person.freqMod);
                        const rOsc = baseR + osc * waveAmpPx * env;
                        const wx = plate.cx + Math.cos(a) * rOsc;
                        const wy = plate.cy + Math.sin(a) * rOsc;
                        if (s === 0) ctx.moveTo(wx, wy);
                        else ctx.lineTo(wx, wy);
                    }
                    ctx.strokeStyle = isHighlighted ? '#FDE047' : 'rgba(234, 179, 8, 0.48)';
                    ctx.lineWidth = isHighlighted ? 1.9 : 1.1;
                    ctx.stroke();
                }

                // Punto dorado de la persona
                const rDot = isHighlighted ? 6.0 : (isIncluded ? 3.8 : 1.8);
                ctx.beginPath();
                ctx.arc(pxNode, pyNode, rDot, 0, Math.PI * 2);
                ctx.fillStyle = isHighlighted ? '#FAF6EE' : (isIncluded ? '#EAB308' : 'rgba(234, 179, 8, 0.18)');
                ctx.fill();
            });

            // 3. Perno metálico central
            drawHexBolt(plate.cx, plate.cy, 10.5);

            ctx.restore();
        }

        function drawHexBolt(cx, cy, hexRadius) {
            ctx.save();
            ctx.translate(cx, cy);

            ctx.beginPath();
            ctx.arc(1.5, 2.5, hexRadius * 1.35, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.82)';
            ctx.fill();

            ctx.beginPath();
            ctx.arc(0, 0, hexRadius * 1.18, 0, Math.PI * 2);
            ctx.fillStyle = '#383532';
            ctx.fill();
            ctx.lineWidth = 1;
            ctx.strokeStyle = '#57534E';
            ctx.stroke();

            ctx.beginPath();
            for (let s = 0; s < 6; s++) {
                const ang = (s * Math.PI) / 3 - Math.PI / 6;
                const hx = Math.cos(ang) * hexRadius;
                const hy = Math.sin(ang) * hexRadius;
                if (s === 0) ctx.moveTo(hx, hy);
                else ctx.lineTo(hx, hy);
            }
            ctx.closePath();

            const grad = ctx.createLinearGradient(-hexRadius, -hexRadius, hexRadius, hexRadius);
            grad.addColorStop(0, '#E7E5E4');
            grad.addColorStop(0.5, '#A8A29E');
            grad.addColorStop(1, '#57534E');
            ctx.fillStyle = grad;
            ctx.fill();
            ctx.lineWidth = 0.9;
            ctx.strokeStyle = '#F5F5F4';
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(0, 0, hexRadius * 0.46, 0, Math.PI * 2);
            ctx.fillStyle = '#D6D3D1';
            ctx.fill();
            ctx.lineWidth = 1;
            ctx.strokeStyle = '#44403C';
            ctx.stroke();

            ctx.restore();
        }

        /**
         * ============================================================================
         * 5. CONTROL DE ETAPAS Y DIAGRAMACIÓN EDITORIAL EN LAS ESQUINAS
         * ============================================================================
         */
        function handlePrimaryAction() {
            if (currentStage === 'intro') {
                goToStage('overview');
            } else if (currentStage === 'overview') {
                enterPlaceDetail('sotomayor');
            } else {
                goToStage('overview');
            }
        }

        function handleTopEmblemClick() {
            if (currentStage === 'intro') {
                goToStage('overview');
            } else if (currentStage === 'detail') {
                goToStage('overview');
            } else {
                goToStage('intro');
            }
        }

        function stepBack() {
            if (currentStage === 'detail') {
                goToStage('overview');
            } else if (currentStage === 'overview') {
                goToStage('intro');
            }
        }

        function goToStage(stageName) {
            currentStage = stageName;
            isolatedPerson = null;
            hoveredItem = null;

            const topNav = document.getElementById('topNavActions');
            const detailFilters = document.getElementById('detailFiltersCorner');
            const quickNav = document.getElementById('QuickPlaceNav');
            const clearPersonBtn = document.getElementById('clearPersonBtn');

            clearPersonBtn.classList.add('hidden');

            if (stageName === 'intro') {
                topNav.classList.add('hidden');
                topNav.classList.remove('flex');
                detailFilters.classList.add('hidden');
                detailFilters.classList.remove('flex');
                quickNav.classList.add('hidden');
            } else if (stageName === 'overview') {
                topNav.classList.remove('hidden');
                topNav.classList.add('flex');
                detailFilters.classList.add('hidden');
                detailFilters.classList.remove('flex');
                quickNav.classList.remove('hidden');
            } else if (stageName === 'detail') {
                topNav.classList.remove('hidden');
                topNav.classList.add('flex');
                detailFilters.classList.remove('hidden');
                detailFilters.classList.add('flex');
                quickNav.classList.remove('hidden');
            }

            distributeParticlesForCurrentStage();
            triggerGentleReorganization();
            updatePosterTypography();
            updateHarmonicEmblem();
        }

        function enterPlaceDetail(placeKey) {
            activePlaceKey = placeKey;
            activeWaveFilter = 'todas';
            activeRingFilter = 0;
            isolatedPerson = null;
            goToStage('detail');
            updateFilterButtonsState();
        }

        function getFilteredPeopleInActivePlace() {
            const all = PLACES_DATA[activePlaceKey].people;
            return all.filter(p => {
                const matchWave = (activeWaveFilter === 'todas' || p.wave === activeWaveFilter);
                const matchRing = (activeRingFilter === 0 || p.ring === activeRingFilter);
                return matchWave && matchRing;
            });
        }

        function setWaveFilter(waveKey) {
            activeWaveFilter = waveKey;
            isolatedPerson = null;
            document.getElementById('clearPersonBtn').classList.add('hidden');
            updateFilterButtonsState();
            triggerGentleReorganization();
            updatePosterTypography();
            updateHarmonicEmblem();
        }

        function setRingFilter(ringLevel) {
            activeRingFilter = (activeRingFilter === ringLevel && ringLevel !== 0) ? 0 : ringLevel;
            isolatedPerson = null;
            document.getElementById('clearPersonBtn').classList.add('hidden');
            updateFilterButtonsState();
            triggerGentleReorganization();
            updatePosterTypography();
            updateHarmonicEmblem();
        }

        function isolateSinglePerson(personObj) {
            isolatedPerson = personObj;
            document.getElementById('clearPersonBtn').classList.remove('hidden');
            triggerGentleReorganization();
            updatePosterTypography();
            updateHarmonicEmblem();
        }

        function clearIsolatedPerson() {
            isolatedPerson = null;
            document.getElementById('clearPersonBtn').classList.add('hidden');
            triggerGentleReorganization();
            updatePosterTypography();
            updateHarmonicEmblem();
        }

        function updateFilterButtonsState() {
            const place = PLACES_DATA[activePlaceKey];
            const summary = placeHarmonicSummary[activePlaceKey];

            document.getElementById('wfCount-todas').textContent = summary.total;
            ['transito', 'obras', 'personas', 'naturaleza'].forEach(wKey => {
                const count = place.people.filter(p =>
                    p.wave === wKey && (activeRingFilter === 0 || p.ring === activeRingFilter)
                ).length;
                document.getElementById('wfCount-' + wKey).textContent = count;
            });

            for (let r = 1; r <= 3; r++) {
                const count = place.people.filter(p =>
                    p.ring === r && (activeWaveFilter === 'todas' || p.wave === activeWaveFilter)
                ).length;
                document.getElementById('rfCount-' + r).textContent = count;
            }

            ['todas', 'transito', 'obras', 'personas', 'naturaleza'].forEach(wKey => {
                const btn = document.getElementById('wf-' + wKey);
                if (btn) btn.classList.toggle('active', activeWaveFilter === wKey);
            });

            for (let r = 0; r <= 3; r++) {
                const btn = document.getElementById('rf-' + r);
                if (btn) btn.classList.toggle('active', activeRingFilter === r);
            }
        }

        /**
         * ============================================================================
         * 6. ACTUALIZACIÓN DEL TEXTO DE LAS ESQUINAS (ESTILO SOUND IMAGE HANDEL)
         * ============================================================================
         */

                    l1.textContent = p.name;

                c2.textContent = '4 pictogramas · 3 niveles de intensidad (Bajo · Medio · Alto)';

            if (currentStage === 'overview') {
                l1.textContent = 'Resonancia Total';
                l2.textContent = '62 personas en 3 territorios';
                l3.textContent = 'Plaza Sotomayor (24)';
                l4.textContent = 'Muelle Prat (20),';
                l5.textContent = 'Buenos Aires (18)';
                c1.textContent = 'Selecciona uno de los 3 lugares en la placa →';
                c2.textContent = 'Tamaños proporcionales al total de personas';
                return;

            // Etapa 2: Lugar en detalle
            const place = PLACES_DATA[activePlaceKey];
            const summary = placeHarmonicSummary[activePlaceKey];
            const filtered = getFilteredPeopleInActivePlace();

            if (isolatedPerson) {

            l1.textContent = place.name;
            l2.textContent = `${filtered.length} de ${summary.total} personas activas`;
            l3.textContent = activeWaveFilter === 'todas'
                ? `Predomina: ${WAVE_TYPES[summary.dominantWave].pictogramName}`
                : `Pictograma: ${WAVE_TYPES[activeWaveFilter].pictogramName}`;

                ? '3 niveles de intensidad (Bajo · Medio · Alto)'

            l5.textContent = place.subtitle;
            c1.textContent = 'Filtra arriba por pictograma o nivel de intensidad →';
            c2.textContent = 'Click aquí para volver a los 3 territorios';
        }

        function updateHarmonicEmblem() {
            const svg = document.getElementById('harmonicEmblem');
            const waveKeys = ['naturaleza', 'transito', 'personas', 'obras'];
            let weights = { naturaleza: 0.34, transito: 0.28, personas: 0.24, obras: 0.14 };

            if (currentStage === 'detail') {
                const filtered = getFilteredPeopleInActivePlace();
                const total = Math.max(1, filtered.length);
                weights = { naturaleza: 0, transito: 0, personas: 0, obras: 0 };
                filtered.forEach(p => weights[p.wave] += 1 / total);
            }

            let html = '';
            waveKeys.forEach((k, idx) => {
                const wInfo = WAVE_TYPES[k];
                const ratio = weights[k];
                const radius = 20 + ratio * 26;
                const sides = Math.max(4, wInfo.emblemSides);
                const rot = (idx * 19 * Math.PI) / 180;

                let pts = [];
                for (let s = 0; s < sides; s++) {
                    const a = (s * 2 * Math.PI) / sides + rot - Math.PI / 2;
                    pts.push(`${(Math.cos(a) * radius).toFixed(1)},${(Math.sin(a) * radius).toFixed(1)}`);
                }

                const isHighlighted = (activeWaveFilter === 'todas' || activeWaveFilter === k);
                const opacity = isHighlighted ? 0.92 : 0.22;
                html += `<polygon points="${pts.join(' ')}" fill="none" stroke="#EAB308" stroke-width="1.5" opacity="${opacity}" />`;
            });

            svg.innerHTML = html;
        }

        /**
         * ============================================================================
         * 7. INTERACCIÓN CON EL LIENZO
         * ============================================================================
         */
        function setupCanvasInteractions() {
            canvas.addEventListener('mousemove', (e) => {
                const mx = e.clientX;
                const my = e.clientY;

                if (currentStage === 'intro') {
                    canvas.style.cursor = 'pointer';
                    return;
                }

                if (currentStage === 'overview') {
                    const { zones } = getOverviewConstellationGeometry();
                    let found = null;
                    for (let z of zones) {
                        if (Math.hypot(mx - z.cx, my - z.cy) <= z.radius * 1.08) {
                            found = z;
                            break;
                        }
                    }
                    const prevKey = hoveredItem ? hoveredItem.key : null;
                    hoveredItem = found ? { type: 'zone', key: found.key } : null;
                    canvas.style.cursor = found ? 'pointer' : 'default';
                    if ((hoveredItem ? hoveredItem.key : null) !== prevKey) {
                        updatePosterTypography();
                    }
                    return;
                }

                // Etapa 2: Detalle del lugar
                const plate = getSinglePlateGeometry(false);
                const place = PLACES_DATA[activePlaceKey];
                let foundPerson = null;
                let minDist = 14;

                for (let p of place.people) {
                    const rPx = plate.radius * INTENSITY_RINGS[p.ring - 1].radiusNorm;
                    const pxNode = plate.cx + Math.cos(p.angle) * rPx;
                    const pyNode = plate.cy + Math.sin(p.angle) * rPx;
                    const d = Math.hypot(mx - pxNode, my - pyNode);
                    if (d < minDist) {
                        minDist = d;
                        foundPerson = p;
                    }
                }

                if (foundPerson) {
                    canvas.style.cursor = 'pointer';
                    hoveredItem = { type: 'person', person: foundPerson };
                    updatePosterTypography();
                    return;
                }

                const distCenter = Math.hypot(mx - plate.cx, my - plate.cy);
                let foundRing = null;
                for (let ring of INTENSITY_RINGS) {
                    if (Math.abs(distCenter - plate.radius * ring.radiusNorm) < 9) {
                        foundRing = ring;
                        break;
                    }
                }

                if (foundRing) {
                    canvas.style.cursor = 'pointer';
                    hoveredItem = { type: 'ring', level: foundRing.level };
                } else {
                    canvas.style.cursor = 'default';
                    if (hoveredItem) {
                        hoveredItem = null;
                        updatePosterTypography();
                    }
                }
            });

            canvas.addEventListener('click', () => {
                if (currentStage === 'intro') {
                    goToStage('overview');
                    return;
                }

                if (currentStage === 'overview') {
                    if (hoveredItem && hoveredItem.type === 'zone') {
                        enterPlaceDetail(hoveredItem.key);
                    }
                    return;
                }

                if (currentStage === 'detail' && hoveredItem) {
                    if (hoveredItem.type === 'person') {
                        if (isolatedPerson && isolatedPerson.id === hoveredItem.person.id) {
                            clearIsolatedPerson();
                        } else {
                            isolateSinglePerson(hoveredItem.person);
                        }
                    } else if (hoveredItem.type === 'ring') {
                        setRingFilter(hoveredItem.level);
                    }
                }
            });
        }
    </script>
